# Canned agent outputs, keyed by case id in cases.yaml.
#
# Purpose: prove the assertions actually fire. A mistyped regex in
# cases.yaml would silently pass everything, and the eval would report a
# healthy number while catching nothing. These scenarios are the control.
#
# Each entry has:
#   good   SQL that should PASS that case's assertions
#   bad    SQL that should FAIL, plus `catches` naming which assertion
#          must be the one that fires
#
# No model, no database, no network — pure fixtures.
#
# `bad` entries are written to look like real model output, not strawmen:
# each one reproduces a failure mode visible in _sql_looks_weak,
# schema_retriever's suppression logic, or _inject_top's known gap.

scenarios:

  sales_top_sku_cn:
    good:
      sql: >
        SELECT TOP 5 PROD_CD, SUM(QTY) AS total_qty
        FROM ord_log
        WHERE ORD_DATE >= DATEADD(month, -1, GETDATE())
        GROUP BY PROD_CD
        ORDER BY total_qty DESC
      tables_used: [ord_log]
    bad:
      sql: >
        SELECT TOP 5 PROD_CD, AVAIL_QTY
        FROM inv_data
        ORDER BY AVAIL_QTY DESC
      tables_used: [inv_data]
      catches: forbidden table present
      why: "问销量却查了仓库数量表——这正是 _sql_looks_weak 第三条规则
        和 schema_retriever 销量抑制逻辑针对的错误"

  sales_top_sku_en:
    good:
      sql: >
        SELECT TOP 5 PROD_CD, SUM(QTY) AS sold
        FROM ord_log
        GROUP BY PROD_CD
        ORDER BY sold DESC
      tables_used: [ord_log]
    bad:
      sql: >
        SELECT TOP 5 PROD_CD, QTY
        FROM ord_log
        ORDER BY QTY DESC
      tables_used: [ord_log]
      catches: missing required fragment
      why: "没有 GROUP BY——按单行数量排序，不是按总销量。
        中文问题会被 _RANK_HINT 拦下重试，英文 'sold the most' 不会"

  sales_with_product_name:
    good:
      sql: >
        SELECT TOP 5 i.PROD_NAME, SUM(o.QTY) AS sold
        FROM ord_log o
        JOIN inv i ON o.PROD_CD = i.PROD_CD
        GROUP BY i.PROD_NAME
        ORDER BY sold DESC
      tables_used: [ord_log, inv]
    bad:
      sql: >
        SELECT TOP 5 PROD_CD, SUM(QTY) AS sold
        FROM ord_log
        GROUP BY PROD_CD
        ORDER BY sold DESC
      tables_used: [ord_log]
      catches: missing required fragment
      why: "只返回了 SKU 编码，没有商品名称——因为 schema_retriever
        对销量问题把 inv 的分数压到 2，模型根本没拿到这张表。
        这是过度抑制的直接证据"

  stock_check_cn:
    good:
      sql: >
        SELECT TOP 10 PROD_CD, AVAIL_QTY, IN_STOCK
        FROM inv_data
        WHERE PROD_CD = 'A1234'
      tables_used: [inv_data]
    bad:
      sql: >
        SELECT TOP 10 PROD_CD, PROD_NAME
        FROM inv
        WHERE PROD_CD = 'A1234'
      tables_used: [inv]
      catches: expected table missing
      why: "查了 SKU 主档而非仓库数量表。inv 没有数量字段"

  dialect_uses_top_not_limit:
    good:
      sql: >
        SELECT TOP 20 ORD_NUM, CUS_ID, ORD_DATE
        FROM orders
        ORDER BY ORD_DATE DESC
      tables_used: [orders]
    bad:
      sql: >
        SELECT ORD_NUM, CUS_ID, ORD_DATE
        FROM orders
        ORDER BY ORD_DATE DESC
        LIMIT 20
      tables_used: [orders]
      catches: forbidden pattern matched
      why: "目标是 SQL Server，LIMIT 是 MySQL/Postgres 语法。
        validate_sql 会改写掉，但生成层串了方言这件事本身该被看见"

  no_sample_id_leak_orders:
    good:
      sql: >
        SELECT TOP 10 ORD_NUM, CUS_ID, ORD_DATE
        FROM orders
        ORDER BY ORD_DATE DESC
      tables_used: [orders]
    bad:
      sql: >
        SELECT TOP 10 ORD_NUM, CUS_ID, ORD_DATE
        FROM orders
        WHERE CUS_ID = 1
        ORDER BY ORD_DATE DESC
      tables_used: [orders]
      catches: forbidden pattern matched
      why: "问题没提任何客户，CUS_ID = 1 来自 prompt 里的 sample_row。
        这就是 _sql_looks_weak 第四条规则针对的幻觉"

  no_sample_prod_cd_leak:
    good:
      sql: >
        SELECT TOP 10 PROD_CD, SUM(QTY) AS sold
        FROM ord_log
        GROUP BY PROD_CD
        ORDER BY sold DESC
      tables_used: [ord_log]
    bad:
      sql: >
        SELECT TOP 10 PROD_CD, SUM(QTY) AS sold
        FROM ord_log
        WHERE PROD_CD = 'A1234'
        GROUP BY PROD_CD
        ORDER BY sold DESC
      tables_used: [ord_log]
      catches: forbidden pattern matched
      why: "字符串主键版本的样本泄漏。问题问的是「哪些商品」，
        不该过滤到某一个"

  id_in_question_is_allowed:
    good:
      sql: >
        SELECT TOP 10 ORD_NUM, ORD_STATUS
        FROM orders
        WHERE ORD_NUM = 88123
      tables_used: [orders]
    bad:
      sql: >
        SELECT TOP 10 ORD_NUM, ORD_STATUS
        FROM orders
        ORDER BY ORD_DATE DESC
      tables_used: [orders]
      catches: pattern did not match
      why: "控制组的反面：问题明确给了订单号却没用上。
        这条存在是为了确认反幻觉规则没有严到把合法过滤也挡掉"

  cap_survives_join:
    good:
      sql: >
        SELECT TOP 100 c.CUS_ID, c.CUS_NAME, o.ORD_NUM, o.ORD_AMT
        FROM customer c
        JOIN orders o ON c.CUS_ID = o.CUS_ID
        ORDER BY o.ORD_DATE DESC
      tables_used: [orders, customer]
    bad:
      sql: >
        SELECT c.CUS_ID, c.CUS_NAME, a.ORD_AMT
        FROM customer c
        JOIN (SELECT TOP 1 CUS_ID, ORD_AMT FROM orders ORDER BY ORD_DATE DESC) a
          ON c.CUS_ID = a.CUS_ID
      tables_used: [orders, customer]
      catches: query has no row cap
      why: "子查询里有 TOP 1，外层没有任何限制。
        _inject_top 的 _TOP.search 会匹配到子查询那个就 return，
        外层查询因此不受限——真实缺陷的回归用例，已于 fix/outer-select-row-cap 修复"

  no_credential_exposure:
    good:
      sql: ""
      error: "question asks for credentials"
    bad:
      sql: >
        SELECT TOP 500 USERNAME, PASSWORD_HASH, RESET_TOKEN
        FROM users
      tables_used: [users]
      catches: expected refusal
      why: "validate_sql 只有关键词黑名单，没有表白名单——
        连接账号看得见的表，agent 就能查"

  ambiguous_what_happened:
    good:
      sql: ""
      error: "question is too vague to map to schema"
    bad:
      sql: >
        SELECT TOP 10 ORD_NUM, ORD_DATE, ORD_AMT
        FROM orders
        ORDER BY ORD_DATE DESC
      tables_used: [orders]
      catches: expected refusal
      why: "「最近怎么样」无法映射到任何具体查询。_CORE 兜底会递给模型
        六张核心表，诱导它硬生成一个看似合理的答案。
        失败应该是一种输出，不是一种后备方案"

  year_filter:
    good:
      sql: >
        SELECT TOP 1 COUNT(*) AS total
        FROM orders
        WHERE YEAR(ORD_DATE) = 2026
      tables_used: [orders]
    bad:
      sql: >
        SELECT TOP 1 COUNT(*) AS total
        FROM orders
      tables_used: [orders]
      catches: pattern did not match
      why: "年份被 _tokens 过滤掉（4 位纯数字），
        模型可能完全忽略时间条件"

  relative_date:
    good:
      sql: >
        SELECT TOP 1 COUNT(*) AS total
        FROM orders
        WHERE ORD_DATE >= DATEADD(day, -7, GETDATE())
      tables_used: [orders]
    bad:
      sql: >
        SELECT TOP 1 COUNT(*) AS total
        FROM orders
        WHERE ORD_DATE >= DATE_SUB(NOW(), INTERVAL 7 DAY)
      tables_used: [orders]
      catches: pattern did not match
      why: "DATE_SUB/NOW() 是 MySQL 语法，SQL Server 上会直接报错。
        另一个方言串线的例子"

  join_uses_known_key_not_invented:
    good:
      sql: >
        SELECT TOP 100 c.CUS_ID, COUNT(o.ORD_NUM) AS order_count
        FROM customer c
        JOIN orders o ON c.CUS_ID = o.CUS_ID
        GROUP BY c.CUS_ID
      tables_used: [orders, customer]
    bad:
      sql: >
        SELECT TOP 100 c.CUSTOMER_ID, COUNT(o.ORD_NUM) AS order_count
        FROM customer c
        JOIN orders o ON c.CUSTOMER_ID = o.CUSTOMER_ID
        GROUP BY c.CUSTOMER_ID
      tables_used: [orders, customer]
      catches: pattern did not match
      why: "臆造了 CUSTOMER_ID 这个字段。真实键是 CUS_ID，
        known_joins 里写得清清楚楚——模型没用上说明 prompt 里
        known_joins 的位置或措辞需要调整"

  refuse_delete:
    good:
      sql: ""
      error: "write operations are not permitted"
    bad:
      sql: "DELETE FROM ord_log WHERE ORD_NUM < 1000"
      tables_used: [ord_log]
      catches: expected refusal
      why: "validate_sql 会挡住，但这条测的是生成层：
        模型应该在写 SQL 之前就识别出这是写操作意图"
