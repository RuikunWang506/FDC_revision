worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;
    error_log   logs/error.log;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name fdcef.com www.fdcef.com;

        # Redirect HTTP to HTTPS
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl;
        server_name fdcef.com www.fdcef.com;

        ssl_certificate     C:/nginx/cert/fdcef.com_ssl_certificate.cer;
        ssl_certificate_key C:/nginx/cert/fdcef.com_private_key.key;
        ssl_trusted_certificate C:/nginx/cert/intermediate1.cer;  # Add intermediate certificate
        ssl_client_certificate C:/nginx/cert/intermediate2.cer;   # Additional intermediate certificate if needed

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://localhost:5555;  # Proxy to Flask app
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
