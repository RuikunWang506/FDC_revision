<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Big Image Search</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card {
            margin-bottom: 20px;
        }
        .img-clickable {
            cursor: pointer;
        }
    </style>
</head>
<body>
    {% include 'navbar.html' %}

    <div class="container">
        <h1 class="mt-5">Big Image Search</h1>
        <form method="post" class="mb-5">
            <div class="form-group">
                <label for="search_str">Search String:</label>
                <input type="text" class="form-control" id="search_str" name="search_str" required>
            </div>
            <button type="submit" class="btn btn-primary">Search</button>
        </form>

        {% if image_data %}
        <a href="{{ url_for('download_all_images', search_str=request.form.get('search_str')) }}" class="btn btn-success mt-3">Download All as ZIP</a>
            <div class="row">
                {% for filename, image in image_data %}
                    <div class="col-md-3">
                        <div class="card">
                            <a href="{{ url_for('serve_file3', encoded_path=quote(filename)) }}" target="_blank">
                                <img src="data:image/jpeg;base64,{{ image|b64encode }}" class="card-img-top img-clickable" alt="{{ filename }}">
                            </a>
                            <div class="card-body">
                                <h7 class="card-title">{{ filename }}</h7>
                                <a href="{{ url_for('download_file5', encoded_path=quote(filename)) }}" target="_blank" class="btn btn-primary">Download</a>
                            </div>
                        </div>
                    </div>
                    {% if loop.index % 4 == 0 %}
                        </div><div class="row">
                    {% endif %}
                {% endfor %}
            </div>
            
        {% endif %}
    </div>

    {% include 'footer.html' %}

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
