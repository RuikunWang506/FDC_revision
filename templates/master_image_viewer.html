<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Image Viewer - FDC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f2e 100%);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            color: #e8f4fd;
            min-height: 100vh;
            padding-top: 70px;
        }
        
        /* Ensure this page has custom background class */
        body.has-navbar {
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f2e 100%) !important;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .main-title {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #00d4ff, #1cc88a, #36b9cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .search-section {
            background: rgba(18, 25, 38, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .search-form {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-input {
            flex: 1;
            padding: 1rem 1.5rem;
            background: rgba(26, 35, 50, 0.8);
            border: 2px solid rgba(0, 240, 255, 0.3);
            border-radius: 15px;
            color: #e8f4fd;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .search-btn {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #00d4ff, #1cc88a);
            border: none;
            border-radius: 15px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.3);
        }

        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .results-section {
            display: none;
        }

        .results-header {
            background: rgba(18, 25, 38, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .category-section {
            margin-bottom: 3rem;
        }

        .category-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 212, 255, 0.1);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            border-left: 4px solid #00d4ff;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }

        .category-title:hover {
            background: rgba(0, 212, 255, 0.15);
            transform: translateY(-1px);
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .category-toggle {
            color: #00d4ff;
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .category-toggle.collapsed {
            transform: rotate(-90deg);
        }

        .category-content {
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease;
            max-height: 5000px;
            opacity: 1;
        }

        .category-content.collapsed {
            max-height: 0;
            opacity: 0;
            margin-bottom: 0;
        }

        .category-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: #00d4ff;
        }

        .category-count {
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .image-card {
            background: rgba(18, 25, 38, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .image-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 240, 255, 0.4);
            box-shadow: 0 15px 35px rgba(0, 212, 255, 0.2);
        }

        .image-container {
            height: 160px;
            background: rgba(26, 35, 50, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            border-radius: 15px 15px 0 0;
        }

        .image-preview {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            object-position: center;
            border-radius: 8px;
        }

        .image-info {
            padding: 1rem;
        }

        .image-filename {
            font-size: 0.9rem;
            font-weight: 600;
            color: #e8f4fd;
            margin-bottom: 0.5rem;
            word-break: break-all;
        }

        .image-details {
            font-size: 0.8rem;
            color: #8892b0;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #8892b0;
        }

        .loading i {
            font-size: 2rem;
            animation: spin 1s linear infinite;
            color: #00d4ff;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            color: #ff6b6b;
            margin: 2rem 0;
        }

        .empty-category {
            text-align: center;
            padding: 2rem;
            color: #8892b0;
            font-style: italic;
        }

        /* Image Popup Modal */
        .image-modal {
            display: none !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000 !important;
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        /* Ensure modal appears above navbar */
        .image-modal.show {
            display: block !important;
        }

        /* Prevent body scroll when modal is open */
        body.modal-open {
            overflow: hidden !important;
            position: fixed !important;
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            top: 0 !important;
            left: 0 !important;
        }

        .modal-content {
            position: relative;
            width: 100vw !important;
            height: 100vh !important;
            display: flex !important;
            flex-direction: row !important;
            flex-wrap: nowrap !important;
            max-width: none;
            max-height: none;
            margin: 0 !important;
            padding: 0 !important;
        }

        .modal-main {
            flex: 1 1 auto !important;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-width: 0; /* Allow shrinking */
            max-width: calc(100vw - 380px) !important; /* Account for sidebar width */
            padding: 0 80px 0 80px; /* Add padding for navigation arrows */
            height: 100vh !important;
            overflow: hidden;
        }

        .modal-image-container {
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: calc(100vw - 380px - 160px); /* Viewport width minus sidebar minus padding */
            max-height: calc(100vh - 4rem);
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .modal-image {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-sidebar {
            width: 380px !important;
            min-width: 380px !important;
            max-width: 380px !important;
            flex: 0 0 380px !important;
            background: rgba(26, 35, 50, 0.98);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            height: 100vh !important;
            position: relative;
            top: 0 !important;
            margin: 0 !important;
        }

        .modal-header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-details {
            flex: 1;
            margin-bottom: 2rem;
        }

        .detail-section {
            margin-bottom: 1.5rem;
        }

        .detail-section h4 {
            color: #00d4ff;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .detail-label {
            color: #8892b0;
            font-size: 0.9rem;
        }

        .detail-value {
            color: #e6f1ff;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: right;
            max-width: 200px;
            word-break: break-all;
        }

        .modal-actions {
            display: flex;
            gap: 0.5rem;
            flex-direction: column;
            margin-top: auto; /* Push to bottom of flex container */
        }

        .modal-action-btn {
            padding: 0.75rem 1rem;
            background: linear-gradient(135deg, #00d4ff, #1cc88a);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .modal-action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.3);
        }

        .modal-close {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            font-size: 1.5rem;
            z-index: 10002;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            transform: scale(1.1);
        }

        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 212, 255, 0.9);
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            font-size: 1.5rem;
            backdrop-filter: blur(10px);
            z-index: 10001;
        }

        .modal-nav:hover {
            background: rgba(0, 212, 255, 1);
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
        }

        .modal-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: translateY(-50%) scale(0.9);
        }

        .modal-prev {
            left: 1rem;
            z-index: 10002;
        }

        .modal-next {
            right: 0.25rem; /* Place right next to the sidebar edge */
            z-index: 10002;
        }

        .modal-info {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-radius: 25px;
            color: white;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-counter {
            font-size: 0.9rem;
            color: #00d4ff;
            margin-bottom: 0.5rem;
        }

        .modal-filename {
            font-weight: 600;
            font-size: 1rem;
        }

        @media (min-width: 769px) {
            /* Desktop styles - ensure navigation doesn't conflict with sidebar */
            .modal-prev {
                left: 1rem;
            }

            .modal-next {
                right: 0.25rem; /* Place right next to the sidebar edge */
            }
        }

        @media (max-width: 768px) {
            .search-form {
                flex-direction: column;
                width: 100%;
            }

            .search-input {
                width: 100%;
            }

            .images-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 1rem;
            }

            .modal-content {
                flex-direction: column;
            }
            
            .modal-sidebar {
                width: 100%;
                min-width: 100%;
                height: 300px;
                max-height: 300px;
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
                padding: 1rem;
                overflow-y: auto;
            }
            
            .modal-main {
                height: calc(100vh - 300px);
                flex: 1;
                padding: 0 60px; /* Reduce padding on mobile */
                width: 100vw; /* Full width on mobile */
            }

            .modal-image-container {
                max-width: calc(100vw - 120px); /* Full width minus mobile padding */
                max-height: calc(100vh - 300px - 4rem); /* Account for sidebar height */
                width: 100%;
                height: 100%;
            }

            .modal-image {
                max-width: 100%;
                max-height: 100%;
                width: 100%;
                height: 100%;
                object-fit: contain;
            }

            .modal-nav {
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }

            .modal-prev {
                left: 1rem;
            }

            .modal-next {
                right: 1rem; /* Reset to normal on mobile */
            }

            .modal-actions {
                flex-direction: row;
                gap: 0.5rem;
            }

            .modal-action-btn {
                padding: 0.5rem 1rem;
                font-size: 0.9rem;
            }

            .modal-nav {
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }

            .modal-prev {
                left: 1rem;
            }

            .modal-next {
                right: 1rem;
            }

            .modal-close {
                top: 1rem;
                right: 1rem;
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    {% include 'navbar.html' %}

    <div class="container">
        <div class="header">
            <h1 class="main-title">Master Image Viewer</h1>
            <p style="color: #8892b0; font-size: 1.1rem;">Search and view all images for any SKU across all sources</p>
        </div>

        <div class="search-section">
            <form class="search-form" id="searchForm">
                <input 
                    type="text" 
                    class="search-input" 
                    id="skuInput" 
                    placeholder="Enter SKU to search all image sources..."
                    autocomplete="off"
                    required
                >
                <button type="submit" class="search-btn" id="searchBtn">
                    <i class="fas fa-search"></i> Search Images
                </button>
            </form>
        </div>

        <div class="loading" id="loadingDiv" style="display: none;">
            <i class="fas fa-spinner"></i>
            <p style="margin-top: 1rem;">Searching all image sources...</p>
        </div>

        <div class="results-section" id="resultsSection">
            <div class="results-header" id="resultsHeader"></div>
            <div id="resultsContainer"></div>
        </div>
    </div>

    <!-- Enhanced Image Modal with Sidebar -->
    <div class="image-modal" id="imageModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">
                <i class="fas fa-times"></i>
            </button>
            
            <div class="modal-main">
                <button class="modal-nav modal-prev" id="modalPrev">
                    <i class="fas fa-chevron-left"></i>
                </button>
                
                <div class="modal-image-container">
                    <img class="modal-image" id="modalImage" src="" alt="">
                </div>
                
                <button class="modal-nav modal-next" id="modalNext">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
            
            <div class="modal-sidebar">
                <div class="modal-header">
                    <div class="modal-counter" id="modalCounter"></div>
                    <div class="modal-filename" id="modalFilename"></div>
                </div>
                
                <div class="modal-details" id="modalDetails">
                    <!-- Details will be populated by JavaScript -->
                </div>
                
                <div class="modal-actions">
                    <button class="modal-action-btn" onclick="downloadImage()">
                        <i class="fas fa-download"></i> Download
                    </button>
                    <button class="modal-action-btn" onclick="copyImageUrl()">
                        <i class="fas fa-link"></i> Copy URL
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allImages = [];
        let currentImageIndex = 0;
        let currentSku = '';

        const searchForm = document.getElementById('searchForm');
        const skuInput = document.getElementById('skuInput');
        const searchBtn = document.getElementById('searchBtn');
        const loadingDiv = document.getElementById('loadingDiv');
        const resultsSection = document.getElementById('resultsSection');
        const resultsHeader = document.getElementById('resultsHeader');
        const resultsContainer = document.getElementById('resultsContainer');
        
        // Modal elements
        const imageModal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');
        const modalClose = document.getElementById('modalClose');
        const modalPrev = document.getElementById('modalPrev');
        const modalNext = document.getElementById('modalNext');
        const modalCounter = document.getElementById('modalCounter');
        const modalFilename = document.getElementById('modalFilename');

        // Search form submission
        searchForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const sku = skuInput.value.trim();
            if (sku) {
                searchImages(sku);
            }
        });

        // Auto-search on Enter key
        skuInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const sku = skuInput.value.trim();
                if (sku) {
                    searchImages(sku);
                }
            }
        });

        async function searchImages(sku) {
            currentSku = sku.toUpperCase();
            
            // Update URL to include SKU parameter (without page reload)
            const newUrl = `/master_image_viewer/${encodeURIComponent(currentSku)}`;
            window.history.pushState({sku: currentSku}, '', newUrl);
            
            // Show loading
            loadingDiv.style.display = 'block';
            resultsSection.style.display = 'none';
            searchBtn.disabled = true;
            searchBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Searching...';

            try {
                const response = await fetch(`/api/search_images?sku=${encodeURIComponent(sku)}`);
                const data = await response.json();

                if (data.error) {
                    showError(data.error);
                    return;
                }

                displayResults(data);
                
            } catch (error) {
                showError('Failed to search images: ' + error.message);
            } finally {
                // Hide loading
                loadingDiv.style.display = 'none';
                searchBtn.disabled = false;
                searchBtn.innerHTML = '<i class="fas fa-search"></i> Search Images';
            }
        }

        function displayResults(data) {
            console.log('displayResults called with data:', data);
            
            // Prepare all images array for modal navigation
            allImages = [];
            
            const categories = [
                { key: 'dam_other', name: 'Catalog_Original Disk', icon: 'fas fa-server' },
                { key: 'dam_dropbox', name: 'Dropbox Images', icon: 'fas fa-cloud' },
                { key: 'dam_big_picture', name: 'Product Images (product_image)', icon: 'fas fa-images' }
            ];

            // Build allImages array
            categories.forEach(category => {
                const images = data[category.key] || [];
                images.forEach(image => {
                    allImages.push({
                        ...image,
                        category: category.name,
                        categoryKey: category.key
                    });
                });
            });

            // Update results header
            resultsHeader.innerHTML = `
                <h2 style="color: #00d4ff; margin-bottom: 0.5rem;">
                    <i class="fas fa-search"></i> Results for SKU: ${data.sku}
                </h2>
                <p style="color: #8892b0;">
                    Found <strong style="color: #1cc88a;">${data.total_count}</strong> images across all sources
                </p>
            `;

            // Generate results HTML
            let resultsHtml = '';
            let globalImageIndex = 0;
            
            categories.forEach(category => {
                const images = data[category.key] || [];
                console.log(`Category ${category.key}: ${images.length} images`);
                
                resultsHtml += `
                    <div class="category-section">
                        <div class="category-title" onclick="toggleCategory('${category.key}')">
                            <div class="category-header">
                                <i class="fas fa-chevron-down category-toggle" id="toggle-${category.key}"></i>
                                <i class="${category.icon}"></i>
                                <span class="category-name">${category.name}</span>
                            </div>
                            <span class="category-count">${images.length}</span>
                        </div>
                        <div class="category-content" id="content-${category.key}">
                `;

                            if (images.length === 0) {
                                resultsHtml += '<div class="empty-category">No images found in this category</div>';
                            } else {
                                resultsHtml += '<div class="images-grid">';
                                
                                images.forEach((image, index) => {
                                    console.log(`Rendering image ${index}: ${image.filename}, URL: ${image.url}`);
                                    
                                    resultsHtml += `
                                        <div class="image-card" onclick="openModal(${globalImageIndex})">
                                            <div class="image-container">
                                                <img class="image-preview" 
                                                     src="${image.url}" 
                                                     alt="${image.filename}"
                                                     onload="console.log('Image loaded: ${image.filename}')"
                                                     onerror="this.closest('.image-card').style.display='none';">
                                            </div>
                                            <div class="image-info">
                                                <div class="image-filename">${image.filename} 
                                                    ${image.is_canonical ? '<span style="color: #1cc88a; font-weight: bold;">[CANONICAL]</span>' : ''}
                                                    <span style="color: #8892b0; font-size: 0.8em;">(v${image.version})</span>
                                                </div>
                                                <div class="image-details">
                                                    Source: ${image.source}<br>
                                                    ${image.relative_path ? `Path: ${image.relative_path}<br>` : ''}
                                                    Dimensions: ${image.width || '?'} × ${image.height || '?'}<br>
                                                    Created: ${image.created_at ? new Date(image.created_at).toLocaleDateString() : 'Unknown'}
                                                </div>
                                            </div>
                                        </div>
                                    `;
                                    globalImageIndex++;
                                });
                                
                                resultsHtml += '</div>';
                            }
                        resultsHtml += '</div>'; // Close category-content
                        resultsHtml += '</div>'; // Close category-section
            });

            resultsContainer.innerHTML = resultsHtml;
            resultsSection.style.display = 'block';
            
            // Restore previous collapse states
            setTimeout(restoreCategoryStates, 100);
        }

        function openModal(imageIndex) {
            if (imageIndex < 0 || imageIndex >= allImages.length) return;
            
            currentImageIndex = imageIndex;
            const image = allImages[imageIndex];
            
            modalImage.src = image.full_url;
            modalCounter.textContent = `${imageIndex + 1} of ${allImages.length}`;
            modalFilename.textContent = `${image.category}: ${image.filename} ${image.is_canonical ? '[CANONICAL]' : ''} (v${image.version})`;
            
            // Populate detailed sidebar
            populateModalDetails(image);
            
            // Update navigation buttons
            modalPrev.disabled = imageIndex === 0;
            modalNext.disabled = imageIndex === allImages.length - 1;
            
            // Hide navbar and remove body padding when modal is open
            const navbar = document.querySelector('.navbar');
            if (navbar) {
                navbar.style.position = 'absolute';
                navbar.style.top = '-200px';
                navbar.style.zIndex = '-1';
                navbar.style.visibility = 'hidden';
            }
            
            // Show modal with proper classes and reset all body positioning
            imageModal.style.display = 'block';
            imageModal.classList.add('show');
            document.body.classList.add('modal-open');
            document.body.style.overflow = 'hidden';
            document.body.style.position = 'fixed';
            document.body.style.width = '100%';
            document.body.style.height = '100%';
            document.body.style.margin = '0';
            document.body.style.padding = '0';
            document.body.style.top = '0';
            document.body.style.left = '0';
        }

        function populateModalDetails(image) {
            const modalDetails = document.getElementById('modalDetails');
            
            let detailsHtml = `
                <div class="detail-section">
                    <h4>Basic Information</h4>
                    <div class="detail-item">
                        <span class="detail-label">SKU:</span>
                        <span class="detail-value">${image.sku}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Filename:</span>
                        <span class="detail-value">${image.filename}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Source:</span>
                        <span class="detail-value">${image.source}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Version:</span>
                        <span class="detail-value">v${image.version}</span>
                    </div>
                    ${image.is_canonical ? '<div class="detail-item"><span class="detail-label">Status:</span><span class="detail-value" style="color: #1cc88a;">Canonical</span></div>' : ''}
                </div>

                <div class="detail-section">
                    <h4>Image Properties</h4>
                    <div class="detail-item">
                        <span class="detail-label">Dimensions:</span>
                        <span class="detail-value">${image.width || '?'} × ${image.height || '?'}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Aspect Ratio:</span>
                        <span class="detail-value">${image.width && image.height ? (image.width / image.height).toFixed(2) : '?'}</span>
                    </div>
                    ${image.file_size ? `
                    <div class="detail-item">
                        <span class="detail-label">File Size:</span>
                        <span class="detail-value">${formatFileSize(image.file_size)}</span>
                    </div>` : ''}
                </div>

                ${image.relative_path || image.directory ? `
                <div class="detail-section">
                    <h4>Location</h4>
                    ${image.relative_path ? `
                    <div class="detail-item">
                        <span class="detail-label">Path:</span>
                        <span class="detail-value">${image.relative_path}</span>
                    </div>` : ''}
                    ${image.directory ? `
                    <div class="detail-item">
                        <span class="detail-label">Directory:</span>
                        <span class="detail-value">${image.directory.split('\\').pop()}</span>
                    </div>` : ''}
                </div>` : ''}

                <div class="detail-section">
                    <h4>Timestamps</h4>
                    <div class="detail-item">
                        <span class="detail-label">Created:</span>
                        <span class="detail-value">${image.created_at ? new Date(image.created_at).toLocaleDateString('en-US', {
                            year: 'numeric',
                            month: 'short',
                            day: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        }) : 'Unknown'}</span>
                    </div>
                </div>

                <div class="detail-section">
                    <h4>URLs</h4>
                    <div class="detail-item">
                        <span class="detail-label">Preview:</span>
                        <span class="detail-value">${image.url}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Full Size:</span>
                        <span class="detail-value">${image.full_url}</span>
                    </div>
                </div>
            `;
            
            modalDetails.innerHTML = detailsHtml;
        }

        function formatFileSize(bytes) {
            if (!bytes) return 'Unknown';
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return Math.round(bytes / Math.pow(1024, i) * 100) / 100 + ' ' + sizes[i];
        }

        function downloadImage() {
            const image = allImages[currentImageIndex];
            const link = document.createElement('a');
            link.href = image.original_url;
            link.download = image.filename;
            link.click();
        }

        function copyImageUrl() {
            const image = allImages[currentImageIndex];
            navigator.clipboard.writeText(window.location.origin + image.original_url).then(() => {
                // Show feedback
                const btn = event.target.closest('.modal-action-btn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                }, 2000);
            });
        }

        function toggleCategory(categoryKey) {
            const content = document.getElementById(`content-${categoryKey}`);
            const toggle = document.getElementById(`toggle-${categoryKey}`);
            
            if (content && toggle) {
                const isCollapsed = content.classList.contains('collapsed');
                
                if (isCollapsed) {
                    // Expand
                    content.classList.remove('collapsed');
                    toggle.classList.remove('collapsed');
                    localStorage.setItem(`category-${categoryKey}`, 'expanded');
                } else {
                    // Collapse
                    content.classList.add('collapsed');
                    toggle.classList.add('collapsed');
                    localStorage.setItem(`category-${categoryKey}`, 'collapsed');
                }
            }
        }

        function restoreCategoryStates() {
            // Restore previously saved collapse states
            const categories = ['dam_other', 'dam_dropbox', 'dam_big_picture'];
            categories.forEach(categoryKey => {
                const savedState = localStorage.getItem(`category-${categoryKey}`);
                if (savedState === 'collapsed') {
                    const content = document.getElementById(`content-${categoryKey}`);
                    const toggle = document.getElementById(`toggle-${categoryKey}`);
                    if (content && toggle) {
                        content.classList.add('collapsed');
                        toggle.classList.add('collapsed');
                    }
                }
            });
        }

        function closeModal() {
            imageModal.style.display = 'none';
            imageModal.classList.remove('show');
            document.body.classList.remove('modal-open');
            
            // Reset all body styles
            document.body.style.overflow = '';
            document.body.style.position = '';
            document.body.style.width = '';
            document.body.style.height = '';
            document.body.style.margin = '';
            document.body.style.padding = '';
            document.body.style.top = '';
            document.body.style.left = '';
            document.body.style.paddingTop = '70px';
            
            // Show navbar and restore when modal is closed
            const navbar = document.querySelector('.navbar');
            if (navbar) {
                navbar.style.position = '';
                navbar.style.top = '';
                navbar.style.zIndex = '';
                navbar.style.visibility = '';
            }
        }

        function navigateModal(direction) {
            const newIndex = currentImageIndex + direction;
            if (newIndex >= 0 && newIndex < allImages.length) {
                currentImageIndex = newIndex;
                const image = allImages[currentImageIndex];
                
                // Update image and sidebar content
                modalImage.src = image.full_url;
                modalCounter.textContent = `${newIndex + 1} of ${allImages.length}`;
                modalFilename.textContent = `${image.category}: ${image.filename} ${image.is_canonical ? '[CANONICAL]' : ''} (v${image.version})`;
                
                // Update sidebar details
                populateModalDetails(image);
                
                // Update navigation buttons
                modalPrev.disabled = newIndex === 0;
                modalNext.disabled = newIndex === allImages.length - 1;
            }
        }

        // Modal event listeners
        modalClose.addEventListener('click', closeModal);
        modalPrev.addEventListener('click', () => navigateModal(-1));
        modalNext.addEventListener('click', () => navigateModal(1));

        // Close modal on background click
        imageModal.addEventListener('click', function(e) {
            if (e.target === imageModal) {
                closeModal();
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (imageModal.style.display === 'block') {
                switch(e.key) {
                    case 'Escape':
                        closeModal();
                        break;
                    case 'ArrowLeft':
                        navigateModal(-1);
                        break;
                    case 'ArrowRight':
                        navigateModal(1);
                        break;
                }
            }
        });

        function showError(message) {
            resultsContainer.innerHTML = `
                <div class="error">
                    <i class="fas fa-exclamation-triangle" style="font-size: 2rem; margin-bottom: 1rem;"></i>
                    <h3>Search Error</h3>
                    <p>${message}</p>
                </div>
            `;
            resultsSection.style.display = 'block';
        }

        // DAM system provides all the formatting we need

        // Auto-focus search input
        skuInput.focus();
        
        // Add custom background class to prevent navbar interference
        document.body.classList.add('custom-background');
        
        // Handle browser back/forward button
        window.addEventListener('popstate', function(event) {
            if (event.state && event.state.sku) {
                skuInput.value = event.state.sku;
                searchImages(event.state.sku);
            } else {
                // No SKU in state, clear results
                skuInput.value = '';
                resultsSection.style.display = 'none';
                allImages = [];
            }
        });
        
        // Auto-search if initial SKU is provided via URL
        {% if initial_sku %}
        const initialSku = '{{ initial_sku }}';
        if (initialSku) {
            skuInput.value = initialSku;
            // Set initial state for browser history
            window.history.replaceState({sku: initialSku}, '', window.location.pathname);
            searchImages(initialSku);
        }
        {% endif %}
    </script>
</body>
</html>
