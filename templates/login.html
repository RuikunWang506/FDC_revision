<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="text-center">FDC Toolkit Login</h2>
                <a href="/location_service" class="text-center"><h3>Quick_location</h3></a>
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Login</button>
                </form>
                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        <div class="alert alert-warning mt-3">
                            {{ messages[0] }}
                        </div>
                    {% endif %}
                {% endwith %}
                
            </div>
        </div>
    </div>
</body>
<footer class="footer mt-5 py-1 bg-light">
    <div class="container text-center justify-content-between align-items-center">
        <div style="margin-top: 10px;">
            <img src="/static/icons/giraffe.ico" alt="Giraffie_here" style="width: 30px; height: 30px;">
            <span class="text-muted"> Powered by FlamingYeti</span>
        </div>
    </div>
</footer>

</html>
