<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmarks</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
</head>
<body>

<div class="container mt-4">
    <h2 class="text-center">Bookmark Links</h2>
    {% include 'navbar.html' %}
    <table id="bookmarkTable" class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>year</th>
                <th>Title</th>
                <th>Category</th>
                <th>Link Type</th>
                <th>URL</th>
            </tr>
        </thead>
        <tbody>
            {% for link in bookmarks_list %}
            <tr>
                <td>{{ link.year }}</td>
                <td>{{ link.title }}</td>
                <td>{{ link.category }}</td>
                <td>{{ link.linktype}}</td>
                <td><a href="{{ link.url }}" target="_blank" class="btn btn-primary btn-sm">Open</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script>
    $(document).ready(function() {
        $('#bookmarkTable').DataTable({
            order: [[0, 'desc']], // Changed 'asc' to 'desc' for descending order
            columnDefs: [{
                targets: 0,
                type: 'num',     // Changed type to 'num' since we're dealing with years
                orderData: [0]
            }]
        });
    });
</script>

</body>
</html>
