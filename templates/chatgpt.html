<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Interface</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Optional: Custom CSS for Chat Styling -->
    <style>
        body {
            background-color: #f8f9fa;
        }
        .chat-container {
            max-width: 60%;
            margin: 50px auto;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        .chat-box {
            height: 600px;
            width:auto;
            overflow-y: scroll;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 15px;
            background-color: #f1f1f1;
        }
        .message {
            margin-bottom: 15px;
        }
        .message.user .message-text {
            background-color: #007bff;
            color: white;
            text-align: right;
        }
        .message.bot .message-text {
            background-color: #e2e2e2;
            text-align: left;
        }
        .message-text {
            display: inline-block;
            padding: 10px 15px;
            border-radius: 20px;
            max-width: 95%;
        }
        .input-group {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    {% include 'navbar.html' %}
    
    <div class="chat-container">
        <h2 class="text-center mb-12">Chat with ChatGPT</h2>
        <h4 class="text-center mb-12">using Mini-4o model API , different from the website version, may not read context inbetween lines</h4>
        <h4 class="text-center mb-12">price is $0.600 / 1M words</h4>
        <div id="chatBox" class="chat-box">
            <!-- Chat messages will appear here -->
        </div>
        <div class="input-group">
            <input type="text" id="userInput" class="form-control" placeholder="Type your message here..." aria-label="User Message">
            <div class="input-group-append">
                <button class="btn btn-primary" id="sendButton" type="button">Send</button>
            </div>
        </div>
    </div>
    
    {% include 'footer.html' %}
    
    <!-- Optional: jQuery and Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <!-- JavaScript for handling chat interactions -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const chatBox = document.getElementById('chatBox');
            const userInput = document.getElementById('userInput');
            const sendButton = document.getElementById('sendButton');

            // Function to append messages to the chat box
            function appendMessage(sender, text) {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message', sender);

                const messageText = document.createElement('div');
                messageText.classList.add('message-text');
                messageText.textContent = text;

                messageDiv.appendChild(messageText);
                chatBox.appendChild(messageDiv);
                
                // Scroll to the bottom of the chat box
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            // Function to send user message to the server
            async function sendMessage() {
                const message = userInput.value.trim();
                if (message === "") {
                    return;
                }

                // Append user message to chat
                appendMessage('user', message);
                userInput.value = "";
                
                try {
                    const response = await fetch('/chatgpt', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ message: message })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        appendMessage('bot', `Error: ${errorData.response}`);
                        return;
                    }

                    const data = await response.json();
                    appendMessage('bot', data.response);
                } catch (error) {
                    appendMessage('bot', 'An error occurred while communicating with the server.');
                    console.error('Error:', error);
                }
            }

            // Event listener for send button
            sendButton.addEventListener('click', sendMessage);

            // Event listener for Enter key
            userInput.addEventListener('keypress', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    sendMessage();
                }
            });
        });
    </script>
</body>
</html>
