<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stable Diffusion Generator & Gallery</title>
  <!-- Bootstrap CSS -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f8f9fa;
      padding-top: 20px;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .gallery {
      margin-top: 30px;
    }
    .gallery-item {
      margin-bottom: 20px;
    }
    .gallery-item img {
      width: 100%;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="text-center mb-4">Stable Diffusion Generator222</h2>
    <form method="POST">
      <div class="form-group">
        <label for="prompt">Prompt:</label>
        <input type="text" class="form-control" id="prompt" name="prompt" placeholder="Describe your scene..." required>
      </div>
      <div class="form-group">
        <label for="negative_prompt">Negative Prompt:</label>
        <input type="text" class="form-control" id="negative_prompt" name="negative_prompt" placeholder="Elements to avoid">
      </div>
      <div class="form-group">
        <label for="steps">Steps2: <span id="stepsValue">30</span></label>
        <input type="range" class="custom-range" id="steps" name="steps" min="10" max="50" value="30">
      </div>
      <div class="form-group">
        <label for="guidance">Guidance: <span id="guidanceValue">7.5</span></label>
        <input type="range" class="custom-range" id="guidance" name="guidance" min="5" max="10" step="0.1" value="7.5">
      </div>
      <div class="form-row">
        <div class="form-group col-md-6">
          <label for="width">Width:</label>
          <input type="number" class="form-control" id="width" name="width" value="512">
        </div>
        <div class="form-group col-md-6">
          <label for="height">Height:</label>
          <input type="number" class="form-control" id="height" name="height" value="512">
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Generate</button>
    </form>
    
    <div class="gallery">
      <h3 class="text-center">Gallery</h3>
      <div class="row">
        {% for item in images_data %}
        <div class="col-md-4 gallery-item">
          <img src="{{ url_for('chatgpt_bp.stable_output', filename=item.filename) }}" alt="Generated image">
          <p><strong>Prompt:</strong> {{ item.prompt }}</p>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
  
  <!-- jQuery and Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script>
    $(document).ready(function(){
      $('#steps').on('input', function(){
        $('#stepsValue').text($(this).val());
      });
      $('#guidance').on('input', function(){
        $('#guidanceValue').text($(this).val());
      });
    });
  </script>
</body>
</html>
