<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Interface</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <style>
        body {
            background-color: #343541 !important;
            color: #343541 !important;
        }
        
        .chat-container {
            max-width: 80%;
            margin: 0 auto;
            padding: 20px;
            height: calc(100vh - 140px);
            display: flex;
            flex-direction: column;
        }
        
        .model-selector {
            background-color: #40414F;
            border: none;
            color: #FFFFFF;
            padding: 8px;
            border-radius: 6px;
        }
        
        .chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .message {
            display: flex;
            padding: 20px;
            margin: 0 -20px;
        }
        
        .message.user { background-color: #343541; }
        .message.bot { background-color: #444654; }
        
        .message-text {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            color: #FFFFFF;
            line-height: 1.8;
            font-size: 16px;
            white-space: pre-wrap;
        }

        .message-text strong,
        .message-text b {
            color: #10a37f;
            font-weight: 600;
        }

        .message-text ul,
        .message-text ol {
            padding-left: 20px;
            margin: 10px 0;
        }

        .message-text li {
            margin: 5px 0;
        }

        .message-text h1,
        .message-text h2,
        .message-text h3 {
            color: #10a37f;
            margin: 15px 0;
        }

        .message-text em {
            color: #81e6d3;
            font-style: normal;
        }

        .message-text code {
            background: #1a1a1a;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            color: #81e6d3;
        }

        /* Style for emojis and bullet points */
        .message-text .emoji {
            font-size: 1.2em;
            margin: 0 2px;
        }

        /* Style for product details */
        .message-text .product-details {
            background: #40414F;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 4px solid #10a37f;
        }
        
        .input-group {
            background-color: #40414F;
            border-radius: 12px;
            padding: 12px;
            margin: 0 auto;
            max-width: 800px;
            position: relative;
            display: flex;
            align-items: center;
        }
        
        #userInput {
            background-color: transparent;
            border: none;
            color: #FFFFFF;
            width: 100%;
            padding: 8px;
        }
        
        #userInput:focus { outline: none; }
        
        .attachment-button {
            background-color: transparent;
            border: none;
            color: #FFFFFF;
            cursor: pointer;
            margin-right: 8px;
            padding: 8px;
        }
        
        #sendButton {
            background-color: transparent;
            border: none;
            color: #FFFFFF;
            cursor: pointer;
            padding: 8px;
        }
        
        .attachment-container {
            display: flex;
            align-items: center;
        }
        
        .file-count {
            color: #FFFFFF;
            font-size: 12px;
            margin-left: 4px;
        }
        
        #attachment { display: none; }
    </style>
</head>
<body>
    {% include 'navbar.html' %}
    
    <div class="chat-container">
        <select id="modelSelect" class="model-selector mb-3">
            {% for model_id, model_info in models.items() %}
                <option value="{{ model_id }}" data-attachments="{{ model_info.attachments|lower }}">
                    {{ model_info.name }}
                </option>
            {% endfor %}
        </select>
        
        <div id="chatBox" class="chat-box"></div>
        
        <div class="input-group">
            <div class="attachment-container">
                <button id="attachmentButton" class="attachment-button" style="display: none;">
                    <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" height="1.5em" width="1.5em">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"></path>
                    </svg>
                </button>
                <span id="fileCount" class="file-count"></span>
            </div>
            <input type="file" id="attachment" accept="image/*" multiple />
            <input type="text" id="userInput" placeholder="Send a message..." />
            <button id="sendButton">
                <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="1.5em" width="1.5em">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}" ></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const chatBox = document.getElementById('chatBox');
            const userInput = document.getElementById('userInput');
            const sendButton = document.getElementById('sendButton');

            async function sendMessage() {
                const message = userInput.value.trim();
                const selectedModel = document.getElementById('modelSelect').value;
                const fileInput = document.getElementById('attachment');
                let attachment = null;
                
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const reader = new FileReader();
                    attachment = await new Promise((resolve) => {
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });
                }
                
                if (message === "") return;

                appendMessage('user', message);
                userInput.value = "";
                fileInput.value = "";
                document.getElementById('fileCount').textContent = "";
                
                try {
                    const response = await fetch('/chatgpt', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ 
                            message: message,
                            model: selectedModel,
                            attachment: attachment
                        })
                    });

                    const data = await response.json();
                    appendMessage('bot', data.response);
                } catch (error) {
                    appendMessage('bot', 'An error occurred while communicating with the server.');
                }
            }

            function appendMessage(sender, text) {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message', sender);

                const messageText = document.createElement('div');
                messageText.classList.add('message-text');

                // Convert markdown-style tables to HTML tables
                text = text.replace(/((\|.+?\|)+\n)+/g, match => {
                    const rows = match.trim().split('\n');
                    let html = '<table class="table table-sm table-bordered text-white">';
                    rows.forEach((row, i) => {
                        const cols = row.trim().split('|').filter(Boolean);
                        html += i === 1 ? '' : '<tr>';
                        cols.forEach(col => {
                            const tag = i === 0 ? 'th' : 'td';
                            html += `<${tag}>${col.trim()}</${tag}>`;
                        });
                        html += i === 1 ? '' : '</tr>';
                    });
                    html += '</table>';
                    return html;
                });

                // Basic formatting

                messageText.innerHTML = text;
                messageDiv.appendChild(messageText);
                chatBox.appendChild(messageDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }
            sendButton.addEventListener('click', sendMessage);
            userInput.addEventListener('keypress', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    sendMessage();
                }
            });

            document.getElementById('modelSelect').addEventListener('change', function() {
                const selectedOption = this.options[this.selectedIndex];
                const attachmentType = selectedOption.getAttribute('data-attachments');
                const attachmentButton = document.getElementById('attachmentButton');
                
                if (attachmentType === 'image') {
                    attachmentButton.style.display = 'block';
                    document.getElementById('attachment').accept = 'image/*';
                    document.getElementById('fileCount').textContent = 'image only';
                } else if (attachmentType === 'true') {
                    attachmentButton.style.display = 'block';
                    document.getElementById('attachment').accept = '*/*';
                    document.getElementById('fileCount').textContent = 'all files';
                } else {
                    attachmentButton.style.display = 'none';
                    document.getElementById('fileCount').textContent = '';
                }
            });

            document.getElementById('attachmentButton').addEventListener('click', function() {
                document.getElementById('attachment').click();
            });

            document.getElementById('attachment').addEventListener('change', function() {
                const fileCount = document.getElementById('fileCount');
                const imageCount = this.files.length;
                
                if (imageCount > 0) {
                    fileCount.textContent = `${imageCount} image${imageCount > 1 ? 's' : ''} selected`;
                } else {
                    fileCount.textContent = 'image only';
                }
            });

            // Trigger initial model selection check
            document.getElementById('modelSelect').dispatchEvent(new Event('change'));
        });
    </script>
</body>
</html>
