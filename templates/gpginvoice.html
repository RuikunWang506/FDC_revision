<html>
<head>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">

    <style>

            color: white !important;
        }
        body {

<body>
    {% include 'navbar.html' %}
    
    <div class="container">
        <h2>GPG Invoice Data</h2>
        
        <div class="filter-controls">
            <input type="text" id="dateFilter" class="filter-input" placeholder="Filter by Date">
            <input type="text" id="partFilter" class="filter-input" placeholder="Filter by Part Number">
        </div>
        
        <div class="action-buttons">
            <button class="btn btn-export" onclick="exportToExcel()">Export to Excel</button>
            <button class="btn btn-copy" onclick="copyTable()">Copy Table</button>
            <button class="btn btn-finish" onclick="finishAndExportQBO()">Finish</button>

        </div>
        
        <!-- Original Table -->
        <div class="table-container">
            {{ table_html|safe }}
        </div>

        <!-- Status message area -->
        <div id="statusMessage" class="alert" style="display: none;"></div>
        
    </div>
    <div class="container">
        <h2>Upload AllPendingOrders PDF</h2>

        <div class="dropzone" id="dropzone">Drag & Drop PDF Here or Click to Upload</div>
        <div id="fileNameDisplay" style="margin-top: 10px; color: #007bff; text-align: center;"></div>
        <input type="file" id="fileInput" accept="application/pdf" class="hidden">
        <button class="btn-convert" id="convertBtn" disabled>Convert & Download</button>

        <div id="downloadSection" class="hidden">
            <p>Download your processed file:</p>
            <a id="downloadLink" class="btn btn-primary" download>Download Excel</a>
        </div>
        <div class="container mt-4">
            <h3>Pivot Table Results</h3>
            <div id="pivotTableContainer" class="table-container" style="display: none;">
                <div id="pivotTableContent"></div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    
    <script>
       $(document).ready(function() {
    let table = $('#gpgTable').DataTable({
        order: [[0, 'desc']], 
        pageLength: 25,
        lengthMenu: [[10, 25, 50, 100, -1], [10, 25, 50, 100, "All"]],
        dom: 'Blfrtip',  // Changed to include 'l' for length menu
        columnDefs: [
            { targets: 0, className: 'dt-body-left', width: '15%' },   // orderNumber
            { targets: 1, className: 'dt-body-left', width: '10%' },   // orderDate
            { targets: 2, className: 'dt-body-left', width: '5%' },    // Row#
            { targets: 3, className: 'dt-body-left', width: '15%' },   // Part Number
            { targets: 4, className: 'dt-body-left', width: '35%' },   // Description - give more space
            { targets: 5, className: 'dt-body-right', width: '10%' },  // Quantity
            { targets: 6, className: 'dt-body-right', width: '10%' },  // Price
        ]
    });

    // Store the table object globally so we can access it in other functions
    window.dataTable = table;
});



        function exportToExcel() {
            const table = document.getElementById('gpgTable');
            const wb = XLSX.utils.table_to_book(table, {sheet: "GPG Orders"});
            XLSX.writeFile(wb, "gpg_orders.xlsx");
        }

        function copyTable() {
            const table = document.getElementById('gpgTable');
            const range = document.createRange();
            range.selectNode(table);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            document.execCommand('copy');
            window.getSelection().removeAllRanges();
            alert('Table copied to clipboard!');
        }


    </script>
    <script>
        function finishAndExportQBO() {
    // Get a reference to the DataTable API object
    const dataTable = window.dataTable;
    
    const csvData = [
        ['InvoiceNo', 'Customer', 'InvoiceDate', 'DueDate', 'Terms', 'Location', 'Memo', 
        'Item(Product/Service)', 'ItemDescription', 'ItemQuantity', 'ItemRate', 'ItemAmount', 'Service Date']
    ];

    // Use DataTable API to get all rows data, not just visible rows
    dataTable.data().each(function(rowData) {
        const invoiceNo = rowData[0] || '';
        const invoiceDate = rowData[1] || '';
        const partNumber = rowData[3] || '';
        const description = rowData[4] || '';
        const quantity = rowData[5] || '';
        const rate = rowData[6] || '';

        // Ensure valid numeric values
        const quantityVal = parseFloat(quantity) || 0;
        const rateVal = parseFloat(rate) || 0;
        const amount = (quantityVal * rateVal).toFixed(2);

        // Calculate due date (30 days from invoice date)
        let dueDateStr = '';
        if (invoiceDate) {
            const dueDate = new Date(invoiceDate);
            dueDate.setDate(dueDate.getDate() + 30);
            dueDateStr = dueDate.toISOString().split('T')[0]; // Format as YYYY-MM-DD
        }

        // Determine manufacturer prefix based on invoice number
        let manufacturerPrefix = '';

        if (invoiceNo.startsWith('CU')) {
        manufacturerPrefix = 'Hyundai:HD_';
        } else if (invoiceNo.startsWith('CT')) {
        manufacturerPrefix = 'Toyota:T_';
        } else if (invoiceNo.startsWith('VA') || invoiceNo.startsWith('CH')) {
        manufacturerPrefix = 'Honda:H_';
        }        
        const itemProductService = manufacturerPrefix + partNumber;

        csvData.push([
            invoiceNo, 'GPG', invoiceDate, dueDateStr, 'Net 30', '', '', 
            itemProductService, description, quantityVal, rateVal, amount, ''
        ]);
    });

    if (csvData.length <= 1) {
        showStatusMessage("No data to export.", "danger");
        return;
    }

    // Convert to CSV format
    const csvContent = csvData.map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });

    // Create a download link for the user
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.setAttribute('download', 'qbo_import.csv');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    
    // Send the CSV content directly to the backend
    fetch('/gpg_finish', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            csvContent: csvContent
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            showStatusMessage(data.message, "success");
        } else {
            showStatusMessage(data.error, "danger");
        }
    })
    .catch(error => {
        showStatusMessage("Error: " + error.message, "danger");
    });
}

function showStatusMessage(message, type) {
    const statusDiv = document.getElementById('statusMessage');
    statusDiv.textContent = message;
    statusDiv.className = 'alert alert-' + type;
    statusDiv.style.display = 'block';
    
    // Hide after 5 seconds
    setTimeout(() => {
        statusDiv.style.display = 'none';
    }, 5000);
}
    </script>
    <script>
        // Get initial timestamp from the server
        let lastCheck = {{ current_time }};
        
        // Poll for updates every 5 seconds
        setInterval(function() {
            fetch(`/gpg_check_updates?last_check=${lastCheck}`)
                .then(response => response.json())
                .then(data => {
                    if (data.update_available) {
                        console.log("New data available - refreshing page");
                        window.location.reload();
                    }
                    lastCheck = data.last_update;
                })
                .catch(error => console.error('Error checking for updates:', error));
        }, 3000);  // Check every 5 seconds
    </script>
    <script>
        let uploadedFile = null;

        document.getElementById("dropzone").addEventListener("click", () => {
            document.getElementById("fileInput").click();
        });

        document.getElementById("fileInput").addEventListener("change", (event) => {
    uploadedFile = event.target.files[0];
    document.getElementById("convertBtn").disabled = !uploadedFile;
    document.getElementById("fileNameDisplay").textContent = uploadedFile.name;
});

        document.getElementById("dropzone").addEventListener("dragover", (event) => {
            event.preventDefault();
            document.getElementById("dropzone").classList.add("dragover");
        });

        document.getElementById("dropzone").addEventListener("dragleave", () => {
            document.getElementById("dropzone").classList.remove("dragover");
        });

        document.getElementById("dropzone").addEventListener("drop", (event) => {
    event.preventDefault();
    document.getElementById("dropzone").classList.remove("dragover");

    if (event.dataTransfer.files.length > 0) {
        uploadedFile = event.dataTransfer.files[0];
        document.getElementById("convertBtn").disabled = false;
        document.getElementById("fileNameDisplay").textContent = uploadedFile.name;
    }
});

        document.getElementById("convertBtn").addEventListener("click", () => {
            if (!uploadedFile) return alert("Please upload a file first!");

            let formData = new FormData();
            formData.append("file", uploadedFile);

            fetch("/upload_pdf", {
                method: "POST",
                body: formData,
            })
            .then(response => {
                if (!response.ok) throw new Error("Error processing file");
                return response.blob();
            })
            .then(blob => {
                let url = window.URL.createObjectURL(blob);
                let a = document.getElementById("downloadLink");
                a.href = url;
                a.download = "pivot_table.xlsx";
                document.getElementById("downloadSection").classList.remove("hidden");
            })
            .catch(error => alert(error.message));
        });
    </script>
<script>
document.getElementById("convertBtn").addEventListener("click", () => {
    if (!uploadedFile) return alert("Please upload a file first!");

    let formData = new FormData();
    formData.append("file", uploadedFile);
    
    // Show loading indicator
    document.getElementById("convertBtn").disabled = true;
    document.getElementById("convertBtn").textContent = "Processing...";

    fetch("/upload_pdf", {
        method: "POST",
        body: formData,
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById("convertBtn").disabled = false;
        document.getElementById("convertBtn").textContent = "Convert & Download";
        
        if (data.error) {
            alert(data.error);
            return;
        }
        
        // Display the pivot table
        if (data.pivotHtml) {
            document.getElementById("pivotTableContent").innerHTML = data.pivotHtml;
            document.getElementById("pivotTableContainer").style.display = "block";
            
            // Initialize DataTable on the pivot table
            if ($.fn.DataTable.isDataTable('#pivotTable')) {
                $('#pivotTable').DataTable().destroy();
            }
            
            $('#pivotTable').DataTable({
                paging: false,
                searching: false,
                info: false,
                order: [[1, 'desc']],  // Sort by quantity column descending
                columnDefs: [
                    { targets: 0, width: '70%', className: 'dt-body-left' },   // Part Number
                    { targets: 1, width: '30%', className: 'dt-body-right' }   // Quantity
                ],
                dom: 't'  // Only show the table, no other controls
            });
        }
        
        // Set up the download link using base64 data
        if (data.excelData) {
            const blob = base64ToBlob(data.excelData, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
            const url = URL.createObjectURL(blob);
            const a = document.getElementById("downloadLink");
            a.href = url;
            a.download = "pivot_table.xlsx";
            document.getElementById("downloadSection").classList.remove("hidden");
        }
    })
    .catch(error => {
        document.getElementById("convertBtn").disabled = false;
        document.getElementById("convertBtn").textContent = "Convert & Download";
        alert("Error processing file: " + error.message);
    });
});

// Helper function to convert base64 to Blob
function base64ToBlob(base64, mimeType) {
    const byteCharacters = atob(base64);
    const byteArrays = [];
    
    for (let offset = 0; offset < byteCharacters.length; offset += 512) {
        const slice = byteCharacters.slice(offset, offset + 512);
        
        const byteNumbers = new Array(slice.length);
        for (let i = 0; i < slice.length; i++) {
            byteNumbers[i] = slice.charCodeAt(i);
        }
        
        const byteArray = new Uint8Array(byteNumbers);
        byteArrays.push(byteArray);
    }
    
    return new Blob(byteArrays, {type: mimeType});
}
</script>
