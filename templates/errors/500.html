<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ _('error.500.title') }}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/favicon-fdc.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
  {% include '_csrf.html' %}
  <style>
    body.fdc-error {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1018 url("{{ url_for('static', filename='rocker-sta-qr8Ci2tzyR8.jpg') }}") center / cover no-repeat fixed;
      color: #e8f4fd;
      font-family: "Segoe UI", sans-serif;
    }
    .fdc-error-card {
      width: min(32rem, 92vw);
      padding: 2.2rem 1.8rem;
      text-align: center;
      background: rgba(12, 18, 28, 0.82);
      border: 1px solid rgba(255, 120, 120, 0.2);
      border-radius: 18px;
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
    }
    .fdc-error-kicker { letter-spacing: .16em; text-transform: uppercase; color: #ffb4b4; font-size: .75rem; margin-bottom: .6rem; }
    .fdc-error-card h1 { font-size: 1.85rem; margin: 0 0 .6rem; }
    .fdc-error-card p { color: #9fb0c4; margin: 0 0 1.4rem; }
    .fdc-error-card a {
      display: inline-block;
      padding: .7rem 1.2rem;
      border-radius: 10px;
      background: linear-gradient(135deg, #00a8cc, #1cc88a);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body class="fdc-error">
  <div class="fdc-error-card">
    <div class="fdc-error-kicker">500</div>
    <h1>{{ _('error.500.title') }}</h1>
    <p>{{ _('error.500.body') }}</p>
    <a href="{{ url_for('home') }}">{{ _('error.home') }}</a>
  </div>
</body>
</html>
