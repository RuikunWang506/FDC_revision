<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .navbar-custom .nav-link {
            display: flex;
            align-items: center;
        }
        .navbar-custom .nav-link img {
            margin-right: 8px;
        }
        .navbar-custom .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light navbar-custom">
        <a class="navbar-brand" href="/">Home</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="/Item_lookup">
                        <img src="/static/icons/magnifying-glass.svg" alt="Item Lookup" style="width: 20px; height: 20px;">
                        Item Lookup
                    </a>
                </li>
                {% if current_user != 'fdc' %}
                <li class="nav-item">
                    <a class="nav-link" href="/Order_lookup">
                        <img src="/static/icons/document.svg" alt="Order Lookup" style="width: 20px; height: 20px;">
                        Order Lookup & Label Maker
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/v4_listcreator">
                        <img src="/static/icons/handbag.svg" alt="V4 List Creator" style="width: 20px; height: 20px;">
                        V4 List Creator
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/googlesheet">
                        <img src="/static/icons/google.svg" alt="Google Sheet" style="width: 20px; height: 20px;">
                        Google Sheet
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/loris">
                        <img src="/static/icons/loris.ico" alt="Loris" style="width: 20px; height: 20px;">
                        Loris
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/calculator">
                        <img src="/static/icons/calculator.ico" alt="Calculator" style="width: 20px; height: 20px;">
                        Calculator
                    </a>
                </li>
                {% endif %}
            </ul>
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/logout">
                        <img src="/static/icons/logout.svg" alt="OUT" style="width: 40px; height: 40px;">
                        Logout
                    </a>
                </li>
            </ul>
        </div>
    </nav>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
