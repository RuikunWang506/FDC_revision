<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .navbar-custom .nav-link {
            display: flex;
            align-items: center;
        }
        .navbar-custom .nav-link img {
            margin-right: 8px;
            width: 30px; /* Set a consistent width for all icons */
            height: 30px; /* Set a consistent height for all icons */
        }
        .navbar-custom .nav-link:hover {
            text-decoration: underline;
        }
        /* Add a border around the three items */
        .custom-box {
            border: 5px solid; /* Make the border thicker to show the rainbow effect */
            border-image-slice: 1;
            border-image-source: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet); /* Rainbow gradient */
            padding: 10px; /* Add some padding inside the box */
            border-radius: 8px; /* Optional: Rounded corners */
            background-color: #f9f9f9; /* Light background */
            display: flex; /* Ensure it stays inline with the other navbar items */
        }
        .navbar-nav {
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light navbar-custom">
        <a class="navbar-brand" href="/">Home</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="/item_lookup">
                        <img src="/static/icons/magnifying-glass.svg" alt="Item Lookup">
                        SKU
                    </a>
                </li>
                {% if current_user != 'fdc' and current_user != 'local_user' %}
                <li class="nav-item">
                    <a class="nav-link" href="/boat">
                        <img src="https://www.svgrepo.com/show/217702/cargo-ship.svg" alt="boat">
                        Boat
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/order_lookup">
                        <img src="/static/icons/document.svg" alt="Order Lookup">
                        Orders
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/v5_listcreator">
                        <img src="/static/icons/handbag.svg" alt="v5 List Creator">
                        List
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/geek_tools">
                        <img src="/static/icons/geek.svg" alt="Geek_Tools">
                        Tools
                    </a>
                </li>

                <!-- Custom Box Around These Items -->
                
                    <a class="nav-link" href="/temu">
                        <img src="https://seller.temu.com/favicon.ico" alt="temu">
                        Temu
                    </a>
    
                    <a class="nav-link" href="/upload_center">
                        <img src="https://img.icons8.com/clouds/200/upload.png" alt="图片处理">
                        图片处理
                    </a>
                    <a class="nav-link" href="/big_img">
                        <img src="/static/icons/bigimg.png" alt="big_img">
                        STOCK_IMG
                    </a>
                    <a class="nav-link" href="/chatgpt">
                        <img src="https://cdn.worldvectorlogo.com/logos/chatgpt-6.svg" alt="chatgpt">
                        chatgpt(Beta)
                    </a>
                    
                    
                 
                {% endif %}
            </ul>
            <ul class="navbar-nav ml-auto">
                
                    <a class="nav-link" href="/help">
                        <img src="https://www.svgrepo.com/show/493520/person-reading-a-book-question-mark.svg" alt="help">
                        HELP
                    </a>
                    <a class="nav-link" href="/logout">
                        <img src="/static/icons/logout.svg" alt="OUT" style="width: 40px; height: 40px;">
                        Logout
                    </a>
                
            </ul>
        </div>
    </nav>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
