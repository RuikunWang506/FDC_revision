<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temu Listings</title>
    <!-- Add Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Include DataTables CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.10.24/css/jquery.dataTables.css">
    <!-- Include DataTables Buttons CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/buttons/1.7.1/css/buttons.dataTables.min.css">
    <!-- Include DataTables Responsive CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/responsive/2.2.9/css/responsive.dataTables.min.css">

    <style>
        /* Basic table styling */
        table {
            border-collapse: collapse;
            width: 100%;
        }
        
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .dataTables_length {
            width: 100%;
            text-align: left;
        }
        .dataTables_dt-buttons {
            width: 100%;
            text-align: left;
        }
        div.dt-buttons {
            display: flex !important;
            justify-content: center !important; /* Center the buttons horizontally */
            margin: 0 auto !important; /* Center the container */
            float: none !important; /* Remove float */
            position: static !important; /* Override position */
        }


        /* Style for loading overlay */
        #loading-overlay {
            display: none; /* Hidden by default */
            position: fixed; /* Sit on top of the page content */
            width: 100%; /* Full width (cover the whole page) */
            height: 100%; /* Full height (cover the whole page) */
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5); /* Black background with 50% opacity */
            z-index: 9999; /* Specify a stack order in case you're using a different order for other elements */
            cursor: wait; /* Add a cursor to indicate waiting */
        }
        /* Loading text styles */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3em;
            color: white;
        }

        /* Center buttons and adjust layout */
        .dataTables_wrapper .dt-buttons {
            text-align: center;
            margin-bottom: 1em;
        }

        .dataTables_wrapper .dataTables_length,
        .dataTables_wrapper .dataTables_filter,
        .dataTables_wrapper .dataTables_info {
            margin-bottom: 1em;
        }

        .dataTables_wrapper .dataTables_paginate {
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Include Navbar -->
    {% include 'navbar.html' %}
    <div class="container text-center">
        <h1>Temu Listings</h1>
    </div>
    {% if sheet_data_html %}
            {{ sheet_data_html|safe }}
    {% else %}
        <p>No data available.</p>
    {% endif %}

    <!-- Include jQuery and DataTables JS files -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.24/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/1.7.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.2.2/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/1.7.1/js/buttons.html5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.68/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.68/vfs_fonts.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.2.9/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.2.9/js/responsive.bootstrap4.min.js"></script>

    <script>
        $(document).ready(function() {
            // Check if the DataTable is already initialized to avoid duplication
            if (!$('table').hasClass('dataTable')) {
                $('table').DataTable({
                    "paging": true, // Enable pagination
                    "searching": true, // Enable search
                    "autoWidth": true, // Enable column auto width
                    "pageLength": 100, // Set default number of entries to show per page
                    "lengthMenu": [10, 25, 50, 100], // Options for number of entries per page
                    dom: '<"container-fluid"<"row"<"col"l><"col"B><"col"f>>>tip',
                    buttons: ['copy', 'excel', 'pdf'],
                    responsive: true // Make the table responsive
                });
            }
        });
    </script>

    {% include 'footer.html' %}
</body>
</html>
