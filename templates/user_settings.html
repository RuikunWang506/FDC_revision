<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('page.user_settings.title') }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>
</head>
<body>
    {% include 'navbar.html' %}
    
    <div class="container mt-4">
        <h2>{{ te('User Settings') }}</h2>
        <p class="text-muted">{{ te('Manage your account settings') }}</p>
        
        {% if success_message %}
            <div class="alert alert-success">{{ success_message }}</div>
        {% endif %}
        
        {% if error_message %}
            <div class="alert alert-danger">{{ error_message }}</div>
        {% endif %}
        
        <div class="row">
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header">
                        <h4>{{ te('Update Email') }}</h4>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            <input type="hidden" name="action" value="update_email">
                            <div class="form-group">
                                <label for="username">{{ te('Username') }}</label>
                                <input type="text" class="form-control" id="username" value="{{ username }}" readonly>
                            </div>
                            <div class="form-group">
                                <label for="email">{{ te('Email') }}</label>
                                <input type="email" class="form-control" id="email" name="email" value="{{ email }}" required>
                            </div>
                            <button type="submit" class="btn btn-primary">{{ te('Update Email') }}</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h4>{{ te('Change Password') }}</h4>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            <input type="hidden" name="action" value="update_password">
                            <div class="form-group">
                                <label for="current_password">{{ te('Current Password') }}</label>
                                <input type="password" class="form-control" id="current_password" name="current_password" required>
                            </div>
                            <div class="form-group">
                                <label for="new_password">{{ te('New Password') }}</label>
                                <input type="password" class="form-control" id="new_password" name="new_password" required>
                            </div>
                            <div class="form-group">
                                <label for="confirm_password">{{ te('Confirm New Password') }}</label>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                            </div>
                            <button type="submit" class="btn btn-primary">{{ te('Change Password') }}</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
