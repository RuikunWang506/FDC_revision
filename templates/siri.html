<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siri Lookup</title>
    <!-- Include Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.10.24/css/jquery.dataTables.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center text-center">
            <form method="POST" action="/siri">
                <h4>Enter Item Number:</h4>
                <div class="form-group">
                    <label for="item_number">Item Number:</label>
                    <input type="text" class="form-control" name="item_number" id="item_number" required>
                </div>
                <button type="submit" class="btn btn-primary">View Result</button>
            </form>
            
            {% if image_urls %}
            <div class="col-12">
                <div class="d-flex flex-wrap justify-content-center">
                    {% for image_url in image_urls %}
                    <img src="{{ image_url }}" alt="Image" class="img-fluid m-2" style="height: 250px;">
                    {% endfor %}
                </div>
            </div>
            {% endif %}
        </div>
    </div>

    <div>
        {% if excel_html %}
        <h2 class="text-center">OMS Data:</h2>
        <table id="excel_table">
            <tbody>
            {{ excel_html | safe }}
            </tbody>
        </table>
        {% endif %}

        {% if sheet_data %}
        <h2 class="text-center">Sheet Data:</h2>
        <table id="sheet_table">
            <tbody>
            {{ sheet_data | safe }}
            </tbody>
        </table>
        {% endif %}
    </div>

    <script type="text/javascript" src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" src="https://cdn.datatables.net/1.10.24/js/jquery.dataTables.js"></script>
    <script type="text/javascript">
        $(document).ready(function() {
            $('#excel_table').DataTable();
            $('#sheet_table').DataTable();
        });
    </script>
</body>
</html>
