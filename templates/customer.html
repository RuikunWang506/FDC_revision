<!doctype html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Search Advanced</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- DataTables CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.10.24/css/jquery.dataTables.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/buttons/1.7.1/css/buttons.dataTables.min.css">
    
    <style>
        /* Custom styles for the table */
        #customerResults table {
            width: auto;
            max-width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        #customerResults th, #customerResults td {
            padding: 10px;
            text-align: left;
            border: 1px solid #dee2e6;
        }
        #customerResults th {
            background-color: #f8f9fa;
        }
        #customerResults tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        
        .details-container {
            display: flex;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .details-section {
            flex: 1;
            min-width: 300px;
            padding: 10px;
            margin: 5px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            background-color: #f8f9fa;
        }
        
        @media (max-width: 992px) {
            .details-section {
                flex: 100%;
            }
        }
    </style>
</head>
<body>
    {% include 'navbar.html' %}
    <div class="title-section text-center">
        <h3 style="color: red;">🎉🎊 Grand Opening 🎊🎉</h3>
        <h1 style="color: red;">Customer Checking Tool V1</h1>
        <h3 style="color: red;">🎉🎊 Grand Opening 🎊🎉</h3>
    </div>
    <div class="d-flex justify-content-center mt-4">
        <div class="col-md-6 justify-content-center text-center">
            <label for="customerNameInput" style="font-size: 30px; color: rgb(0, 0, 255);">Check Customer Name</label><br>
            <input type="text" id="customerNameInput" placeholder="Enter customer name"><br><br>
            <button id="checkCustomerButton" class="btn btn-primary" onclick="checkCustomerId()">Check cus_id</button>
        </div>
    </div>
    
    <div id="customerResults" class="mt-3 d-flex justify-content-center"></div>
    
    <!-- New container for all customer details -->
    <div class="details-container" id="allCustomerDetails"></div>
    
    <!-- Required Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.24/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/1.7.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/1.7.1/js/buttons.html5.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        function checkCustomerId() {
            const customerName = document.getElementById('customerNameInput').value;
            if (!customerName) {
                alert("Please enter a customer name.");
                return;
            }

            $.ajax({
                type: "POST",
                url: "/check_customer",
                data: JSON.stringify({ customer_name: customerName }),
                contentType: "application/json",
                success: function(response) {
                    const resultsDiv = document.getElementById('customerResults');
                    resultsDiv.innerHTML = ""; 
                    if (response.success) {
                        let html = "<table class='table table-bordered'><thead><tr><th>Customer Name</th><th>Customer ID</th><th>Database Origin</th></tr></thead><tbody>";
                        response.data.forEach(row => {
                            html += `<tr><td>${row.cus_nm}</td><td><a href="#" onclick="getCustomerDetails('${row.cus_id}')">${row.cus_id}</a></td><td>${row.database_origin}</td></tr>`;
                        });
                        html += "</tbody></table>";
                        resultsDiv.innerHTML = html;
                    } else {
                        resultsDiv.innerHTML = `<div class='alert alert-danger'>${response.message}</div>`;
                    }
                },
                error: function() {
                    alert("An error occurred while checking the customer ID.");
                }
            });
        }

        function getCustomerDetails(customerId) {
            $.ajax({
                type: "GET",
                url: `/customer_details/${customerId}`,
                success: function(response) {
                    const allDetailsDiv = document.getElementById('allCustomerDetails');
                    allDetailsDiv.innerHTML = ""; 
                    
                    if (response.success) {
                        const detailsSection = document.createElement('div');
                        detailsSection.className = 'details-section';
                        detailsSection.innerHTML = `<h4>Customer Order History</h4><div id="customerOrderHistory">${response.data}</div>`;
                        
                        const orderNumbersSection = document.createElement('div');
                        orderNumbersSection.className = 'details-section';
                        orderNumbersSection.innerHTML = `
                            <h4>Unique Order Numbers</h4>
                            <table id="orderNumbersTable" class="table table-bordered">
                                <thead>
                                    <tr>
                                        <th>Order</th>
                                        <th>Date</th>
                                        <th>Item total</th>
                                        <th>Handling</th>
                                        <th>Total</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${response.unique_order_numbers.map(order => `
                                        <tr>
                                            <td><a href="${order.order_lookup_url}">${order.order_number}</a></td>

                                            <td>${order.date}</td>
                                            <td>${parseFloat(order.ord_amt || 0).toFixed(2)}</td>
                                            <td>${parseFloat(order.handl_fee || 0).toFixed(2)}</td>
                                            <td>${parseFloat(order.total || 0).toFixed(2)}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        `;
                        
                        const productSummarySection = document.createElement('div');
                        productSummarySection.className = 'details-section';
                        productSummarySection.innerHTML = `<div id="productSummary">${response.product_summary}</div>`;
                        
                        allDetailsDiv.appendChild(detailsSection);
                        allDetailsDiv.appendChild(productSummarySection);
                        allDetailsDiv.appendChild(orderNumbersSection);

                        // Initialize DataTable for order numbers
                        $('#orderNumbersTable').DataTable({
                            "order": [[0, "desc"]], // Sort by the first column (Order Number) in descending order
                            "scrollX": true,
                            "autoWidth": false,
                            "paging": true,
                            "searching": true,
                            "info": true,
                            "pageLength": 100,
                            "lengthMenu": [[5, 10, 25, 50, 100, -1], [5, 10, 25, 50, 100, "All"]],
                            "dom": 'Blfrtip',
                            "buttons": ['excelHtml5']
                        });

                        setTimeout(function() {
                            if ($.fn.DataTable.isDataTable('#customer_details_table')) {
                                $('#customer_details_table').DataTable().destroy();
                            }
                            if ($.fn.DataTable.isDataTable('#product_summary_table')) {
                                $('#product_summary_table').DataTable().destroy();
                            }

                            $('#customer_details_table').DataTable({
                                "order": [[0, "desc"]], // Sort by the first column (Order Number) in descending order
                                "scrollX": true,
                                "autoWidth": false,
                                "paging": true,
                                "searching": true,
                                "info": true,
                                "pageLength": 100,
                                "lengthMenu": [[5, 10, 25, 50, 100, -1], [5, 10, 25, 50, 100, "All"]],
                                "dom": 'Blfrtip',
                                "buttons": ['excelHtml5']
                            });

                            $('#product_summary_table').DataTable({
                                "scrollX": true,
                                "autoWidth": false,
                                "paging": true,
                                "searching": true,
                                "info": true,
                                "pageLength": 100,
                                "lengthMenu": [[5, 10, 25, 50, 100, -1], [5, 10, 25, 50, 100, "All"]],
                                "dom": 'Blfrtip',
                                "buttons": ['excelHtml5']
                            });
                        }, 100);
                    } else {
                        allDetailsDiv.innerHTML = `<div class='alert alert-danger'>${response.message}</div>`;
                    }
                },
                error: function() {
                    alert("An error occurred while retrieving customer details.");
                }
            });
        }

        document.getElementById('customerNameInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                checkCustomerId();
            }
        });
    </script>
</body>
</html>
