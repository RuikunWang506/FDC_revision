<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report a Bug</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.10.24/css/jquery.dataTables.css">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <style>
        #bug_description {
            width: 100%;
            min-height: 100px;
            resize: both;
        }
    </style>
</head>
<body>
    {% include 'navbar.html' %}
    
    <div class="container justify-content-center text-center">
        <h1>Report a Bug / Request a Feature</h1>
        <form action="/report_bug" method="POST" enctype="multipart/form-data">
            <label for="bug_type">Which Page or function:</label>
            <select name="bug_type" id="bug_type">
                <option value="general">General Function</option>
                <option value="item_lookup">Item Lookup</option>
                <option value="order_lookup">Order Lookup</option>
                <option value="list_creator">List Creator</option>
            </select>
            <br>
            <label for="bug_description">What say you:</label>
            <textarea id="bug_description" name="bug_description" required></textarea>
            <br>
            <label for="bug_file">Upload File:</label>
            <input type="file" id="bug_file" name="bug_file">
            <br>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
    {% include 'footer.html' %}
</body>
</html>
