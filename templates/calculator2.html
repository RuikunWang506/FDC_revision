<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Legendary Calculator</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .container {
      margin-top: 20px;
    }
    h1, h4 {
      color: #343a40;
    }
    .box {
      border: 1px solid #dee2e6;
      border-radius: 5px;
      padding: 20px;
      background-color: #ffffff;
      margin-bottom: 20px;
    }
    .flex-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .input-container {
      position: relative;
      width: 48%;
      margin-bottom: 20px;
      padding-top: 30px; /* Add padding to the top */
    }
    input[type="number"], input[type="text"] {
      height: 40px;
      font-size: 1.2em;
      border: 1px solid #ced4da;
      border-radius: 4px;
      width: 100%;
      padding: 5px 10px;
      box-sizing: border-box;
    }
    .result {
      font-weight: bold;
      height: 40px; /* Fixed height */
      width: 100%; /* Ensure it fits within its container */
      padding: 10px;
      line-height: 20px; /* Center the text vertically */
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #ced4da;
      border-radius: 4px;
      background-color: #ffffff; /* Ensure result background matches container */
      overflow: hidden; /* Prevent content overflow */
      white-space: nowrap; /* Prevent text wrapping */
      text-overflow: ellipsis; /* Add ellipsis if text overflows */
    }
    .form-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }
    .form-group label {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      background-color: #ffffff;
      padding: 0 5px;
      font-weight: normal;
      z-index: 1; /* Ensure label stays on top */
    }
    table {
      width: 100%;
      height: auto;
      border-collapse: collapse;
      font-family: Arial, sans-serif;
    }
    td {
      padding: 5px;
      text-align: center;
    }
    input[type="text"].calculator-input {
      width: 100%;
      height: 40px; /* Adjusted height */
      text-align: right;
      font-family: monospace;
      font-size: 1.2em; /* Adjusted font size */
      font-weight: bold;
      border-color: gray;
      border-width: 1px;
      border-style: solid;
      opacity: 0.5;
    }
    input[type="text"].calculator-input:hover {
      opacity: 2;
    }
    input[type="button"] {
      opacity: 0.8;
      background-color: #f5f5f5;
      background-image: linear-gradient(top, #f5f5f5, #f1f1f1);
      border: 1px solid #dedede;
      color: #444;
      height: 45px;
      width: 100%;
      text-align: center;
      font-size: 1.2em;
      font-weight: normal;
    }
    input[type="button"]:hover {
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
      background-image: linear-gradient(top, #f8f8f8, #f1f1f1);
      opacity: 1;
      border: 1px solid #c6c6c6;
      color: #222;
      cursor: pointer;
    }
    input[name="equal"] {
      background-color: #4d90fe;
      background-image: linear-gradient(top, #4d90fe, #4787ed);
      border: 1px solid #3079ed;
      color: #fefefe;
    }
    input[name="equal"]:hover {
      background-color: #4d90fe;
      background-image: linear-gradient(top, #4d90fe, #357ae8);
      border: 1px solid #2f5bb7;
      color: #fefefe;
    }
    input[name="operator"] {
      border: 1px solid #c6c6c6;
      background-color: #d6d6d6;
    }

    .date-container {
      display: flex;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .date-input {
      width: 40px;
      text-align: center;
      margin: 0 2px;
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .date-input:focus {
      border-color: #007bff;
      outline: none;
    }

  

  </style>
</head>
<body>
  {% include 'navbar.html' %}
  <div class="container">
    <div class="text-center mb-5">
      <h1>Online Toolkit</h1>
    </div>

    <div class="row">
      <div class="col-md-6 box">
        <h2 class="text-center">厘米转换器 CM converter</h2>
        <h5 class="text-center">输入cm,变身inch, 1 cm=0.393701 inch</h5>
        <div class="form-group">
          <div class="input-container">
            <label for="inputcm1">Length(cm)</label>
            <input id="inputcm1" type="number" placeholder="Enter length in cm" oninput="LengthConverter1(this.value)">
          </div>
          <div class="input-container">
            <label for="outputInches1">Length(in)</label>
            <span id="outputInches1" class="result"></span>
          </div>
        </div>
        <div class="form-group">
          <div class="input-container">
            <label for="inputcm2">Width(cm)</label>
            <input id="inputcm2" type="number" placeholder="Enter width in cm" oninput="LengthConverter2(this.value)">
          </div>
          <div class="input-container">
            <label for="outputInches2">Width(in)</label>
            <span id="outputInches2" class="result"></span>
          </div>
        </div>
        <div class="form-group">
          <div class="input-container">
            <label for="inputcm3">Height(cm)</label>
            <input id="inputcm3" type="number" placeholder="Enter height in cm" oninput="LengthConverter3(this.value)">
          </div>
          <div class="input-container">
            <label for="outputInches3">Height(in)</label>
            <span id="outputInches3" class="result"></span>
          </div>
        </div>
      </div>
      
      <div class="col-md-6 box">
        <h2 class="text-center">重量转换</h2>
        <h5 class="text-center">输入kg,变身lb, 1kg=2.2lb</h5>
        <div class="form-group">
          <div class="input-container">
            <label for="kginput">kg to lb</label>
            <input type="number" id="kginput" placeholder="Enter weight in kg" oninput="kgtolb(this.value)">
          </div>
          <div class="input-container">
            <label for="kglbresult">Weight(lb)</label>
            <span id="kglbresult" class="result"></span>
          </div>
        </div>
        <div class="form-group">
          <div class="input-container">
            <label for="lbinput">lb to kg</label>
            <input type="number" id="lbinput" placeholder="Enter weight in lb" oninput="lbtokg(this.value)">
          </div>
          <div class="input-container">
            <label for="lbkgresult">Weight(kg)</label>
            <span id="lbkgresult" class="result"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="row">
      <div class="col-md-6 box text-center">
        <h4>计算器</h4>
        <table>
          <tr>
            <td colspan="7">
              <input type="text" id="display" value="" />
            </td>
          </tr>
          <tr>
            <td><input id="btnAns" type="button" name="operator" value="Ans" /></td>
            <td><input id="btnPi" type="button" name="operator" value="π" onclick="set('3.14')" /></td>
            <td><input id="btnE" type="button" name="operator" value="e" /></td>
            <td><input id="btnOParen" type="button" name="operator" value="(" onclick="set('(')" /></td>
            <td><input id="btnCParen" type="button" name="operator" value=")" onclick="set(')')" /></td>
            <td><input id="btnPcnt" type="button" name="operator" value="%" /></td>
            <td><input id="btnCE" type="button" name="operator" value="CE" onclick="ce()" /></td>
          </tr>
          <tr>
            <td><input id="btnRad" type="button" name="operator" value="rad" /></td>
            <td><input id="btnDeg" type="button" name="operator" value="deg" /></td>
            <td><input id="btnFact" type="button" name="operator" value="x!" /></td>
            <td><input id="btn7" type="button" value="7" onclick="set('7')" /></td>
            <td><input id="btn8" type="button" value="8" onclick="set('8')" /></td>
            <td><input id="btn9" type="button" value="9" onclick="set('9')" /></td>
            <td><input id="btnDiv" type="button" name="operator" value="÷" onclick="set('/')" /></td>
          </tr>
          <tr>
            <td><input id="btnSineInv" type="button" name="operator" value="asin" onclick="asine()" /></td>
            <td><input id="btnSine" type="button" name="operator" value="sin" onclick="sine()" /></td>
            <td><input id="btnLN" type="button" name="operator" value="ln" /></td>
            <td><input id="btn4" type="button" value="4" onclick="set('4')" /></td>
            <td><input id="btn5" type="button" value="5" onclick="set('5')" /></td>
            <td><input id="btn6" type="button" value="6" onclick="set('6')" /></td>
            <td><input id="btnMul" type="button" name="operator" value="×" onclick="set('*')" /></td>
          </tr>
          <tr>
            <td><input id="btnCosInv" type="button" name="operator" value="acos" onclick="acosine()" /></td>
            <td><input id="btnCos" type="button" name="operator" value="cos" onclick="cosine()" /></td>
            <td><input id="btnLog" type="button" name="operator" value="log" onclick="fLog()" /></td>
            <td><input id="btn1" type="button" value="1" onclick="set('1')" /></td>
            <td><input id="btn2" type="button" value="2" onclick="set('2')" /></td>
            <td><input id="btn3" type="button" value="3" onclick="set('3')" /></td>
            <td><input id="btnSub" type="button" name="operator" value="-" onclick="set('-')" /></td>
          </tr>
          <tr>
            <td><input id="btnTanInv" type="button" name="operator" value="atan" onclick="atangent()" /></td>
            <td><input id="btnTan" type="button" name="operator" value="tan" onclick="tangent()" /></td>
            <td><input id="btnSqrt" type="button" name="operator" value="√" onclick="sqrRoot()" /></td>
            <td><input id="btn0" type="button" value="0" onclick="set('0')" /></td>
            <td><input id="btnPeriod" type="button" value="." /></td>
            <td><input id="btnEqual" type="button" name="equal" value="=" onclick="answer()" /></td>
            <td><input id="btnAdd" type="button" name="operator" value="+" onclick="set('+')" /></td>
          </tr>
        </table>
      </div>
      <div class="col-md-6 box text-center">
        <h4>计算机</h4>
        <div class="form-group">
          <div class="input-container">
            <label for="calculatorInput">expression</label>
            <input type="text" id="calculatorInput" class="calculator-input" placeholder="Enter expression" oninput="calculateResult()">
          </div>
          <div class="input-container">
            <label for="calculatorResult">result</label>
            <span id="calculatorResult" class="result"></span>
          </div>
        </div>
        <h4>勾股定理（搁浅）</h4>
         <div class="row">
            <div class="col-md-3">
                
                    <label for="calculatorInput1">side 1</label>
                    <input type="number" id="calculatorInput1" class="calculator-input" placeholder="Enter first value" oninput="calculateTriangleSide()">
                
            </div>
            <div class="col-md-3">
                
                    <label for="calculatorInput2">side 2</label>
                    <input type="number" id="calculatorInput2" class="calculator-input" placeholder="Enter second value" oninput="calculateTriangleSide()">
                
            </div>
            <div class="col-md-6">
                
                    <label for="triangleResult">side 3</label>
                    <span id="triangleResult" class="result"></span>
                
            </div>
          </div>
      </div>

      <div class="col-md-6 box text-center">
        <h4>数据库时间</h4>
        <div class="form-group">
          <div class="input-container">
            <label for="dateconvertInput">81088-</label>
            <input type="text" id="dateconvertInput" class="dateconvert-input" placeholder="Enter expression" oninput="dateconvert()">
          </div>
          <div class="input-container">
            <label for="dateconvert">result</label>
            <span id="dateconvert" class="result"></span>
          </div>
        </div>
        <div class="form-group">
          <div class="input-container">
            <label for="date-container">MM/DD/YYYY</label>
            <div class="date-container">
              <input type="number" id="monthInput" class="date-input" placeholder="MM" min="1" max="12" oninput="validateDate()">
              /
              <input type="number" id="dayInput" class="date-input" placeholder="DD" min="1" max="31" oninput="validateDate()">
              /
              <input type="number" id="yearInput" class="date-input" placeholder="YYYY" maxlength="4">
            </div>
          </div>
          <div class="input-container">
            <label for="dateToNumberResult">Number Result</label>
            <span id="dateToNumberResult" class="result"></span>
          </div>
        </div>
      </div>
      </div>
    </div>
  </div>
  
  {% include 'footer.html' %}
  
  <script>
    function LengthConverter1(valNum) {
      document.getElementById("outputInches1").innerHTML = (valNum * 0.393701).toFixed(2);
    }

    function LengthConverter2(valNum) {
      document.getElementById("outputInches2").innerHTML = (valNum * 0.393701).toFixed(2);
    }

    function LengthConverter3(valNum) {
      document.getElementById("outputInches3").innerHTML = (valNum * 0.393701).toFixed(2);
    }

    function kgtolb(valNum) {
      document.getElementById("kglbresult").innerHTML = (valNum * 2.20462).toFixed(2);
    }

    function lbtokg(valNum) {
      document.getElementById("lbkgresult").innerHTML = (valNum / 2.20462).toFixed(2);
    }

    function set(op) {
      document.getElementById("display").value += op;
    }

    function sqrRoot() {
      var tempStore = document.getElementById("display").value;
      document.getElementById("display").value = eval(Math.sqrt(tempStore));
    }

    function asine() {
      var tempStore = document.getElementById("display").value;
      document.getElementById("display").value = eval(Math.asin(tempStore));
    }

    function acosine() {
      var tempStore = document.getElementById("display").value;
      document.getElementById("display").value = eval(Math.acos(tempStore));
    }

    function fLog() {
      var tempStore = document.getElementById("display").value;
      document.getElementById("display").value = eval(Math.log(tempStore));
    }

    function atangent() {
      var tempStore = document.getElementById("display").value;
      document.getElementById("display").value = eval(Math.atan(tempStore));
    }

    function tangent() {
      var tempStore = document.getElementById("display").value;
      document.getElementById("display").value = eval(Math.tan(tempStore));
    }

    function cosine() {
      var tempStore = document.getElementById("display").value;
      document.getElementById("display").value = eval(Math.cos(tempStore));
    }

    function sine() {
      var tempStore = document.getElementById("display").value;
      document.getElementById("display").value = eval(Math.sin(tempStore));
    }

    function setOp() {
      alert("gf");
      //document.getElementById("display").value += op;
    }

    function answer() {
      var Exp = document.getElementById("display");
      var Exp1 = Exp.value;
      var result = eval(Exp1);
      //alert(result);
      Exp.value = result;
    }

    function ce() {
      var elem = document.getElementById("display").value;
      var length = elem.length;
      length--;
      var a = elem.substr(0, length);
      document.getElementById("display").value = a;
    }
     function calculateTriangleSide() {
        const input1 = parseFloat(document.getElementById('calculatorInput1').value);
        const input2 = parseFloat(document.getElementById('calculatorInput2').value);

        if (!isNaN(input1) && !isNaN(input2)) {
            const result = Math.sqrt(Math.pow(input1, 2) + Math.pow(input2, 2));
            document.getElementById('triangleResult').innerText = result.toFixed(2);
        } else {
            document.getElementById('triangleResult').innerText = '';
        }
    }

    function calculateResult() {
        const expression = document.getElementById('calculatorInput').value;
        try {
            const result = eval(expression);
            document.getElementById('calculatorResult').innerText = result;
        } catch {
            document.getElementById('calculatorResult').innerText = 'Invalid expression';
        }
    }
    function calculateResult() {
      const calculatorInput = document.getElementById('calculatorInput').value;
      const calculatorResult = document.getElementById('calculatorResult');
      try {
        const result = eval(calculatorInput.replace(/[^-()\d/*+.]/g, ''));
        calculatorResult.textContent = result.toFixed(2);
      } catch (error) {
        calculatorResult.textContent = "Error";
      }
    } 
    function validateDate() {
      const monthInput = document.getElementById('monthInput');
      const dayInput = document.getElementById('dayInput');

      // Pad month and day with leading zero if necessary
      let month = monthInput.value;
      let day = dayInput.value;

      if (month < 10 && month.length === 1) month = '0' + month;
      if (day < 10 && day.length === 1) day = '0' + day;

      monthInput.value = month;
      dayInput.value = day;
    }

    function resultdataconvert(inputNumber) {
      const baseDate = new Date('2023-01-01'); // Your base date
      const offsetDays = inputNumber - 81088; // Subtract the offset from the input
      const calculatedDate = new Date(baseDate);
      calculatedDate.setDate(baseDate.getDate() + offsetDays + 1);

      // Extracting the month, day, and year from the calculated date
      const month = ('0' + (calculatedDate.getMonth() + 1)).slice(-2); // getMonth() is 0-based
      const day = ('0' + calculatedDate.getDate()).slice(-2);
      const year = calculatedDate.getFullYear();

      // Return the formatted date as MM/DD/YYYY
      return month + '/' + day + '/' + year;
    }

    // The function to convert input number to date and display it
    function dateconvert() {
      const dateInput = document.getElementById('dateconvertInput').value;
      const dateResult = document.getElementById('dateconvert');
      try {
        const numericInput = parseInt(dateInput, 10); // Parse the input as an integer
        const convertedDate = resultdataconvert(numericInput);
        dateResult.textContent = convertedDate;
      } catch (error) {
        dateResult.textContent = "Error";
      }
    }
    function resultdataconvert(inputNumber) {
      const baseDate = new Date('2023-01-01'); // Your base date
      const offsetDays = inputNumber - 81088; // Subtract the offset from the input
      const calculatedDate = new Date(baseDate);
      calculatedDate.setDate(baseDate.getDate() + offsetDays + 1); // Add 1 to adjust for the discrepancy

      const month = ('0' + (calculatedDate.getMonth() + 1)).slice(-2);
      const day = ('0' + calculatedDate.getDate()).slice(-2);
      const year = calculatedDate.getFullYear();

      return month + '/' + day + '/' + year;
    }

    // Function to convert date input to a number
    function dateToNumberConvert() {
      const month = document.getElementById('monthInput').value;
      const day = document.getElementById('dayInput').value;
      const year = document.getElementById('yearInput').value;
      
      const inputDate = new Date(`${year}-${month}-${day}`);
      const baseDate = new Date('2023-01-01');
      
      const diffTime = Math.abs(inputDate - baseDate);
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      const resultNumber = diffDays + 81088; // Add 81088 to get the final number
      document.getElementById('dateToNumberResult').textContent = resultNumber;
    }

    // Event listeners to trigger the conversion when user inputs date
    document.getElementById('monthInput').addEventListener('input', dateToNumberConvert);
    document.getElementById('dayInput').addEventListener('input', dateToNumberConvert);
    document.getElementById('yearInput').addEventListener('input', dateToNumberConvert);
    

  </script>
</body>
</html>
