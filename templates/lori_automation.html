<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lori's Automation Center</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    
    <style>
        .border-dashed {
            border-style: dashed !important;
        }
        .highlight-drop {
            border-color: #007bff !important;
            background-color: #f8f9fa;
        }
        .navbar {
            background-color: #343a40;
        }
        .navbar-brand {
            color: white !important;
        }
        .nav-link {
            color: rgba(255,255,255,.8) !important;
        }
        .nav-link:hover {
            color: white !important;
        }
        #drop-zone {
            min-height: 200px;
            transition: all 0.3s ease;
        }
        #drop-zone:hover {
            background-color: #f8f9fa;
            cursor: pointer;
        }
        .processing-indicator {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
        }
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .loading-content {
            text-align: center;
        }
        [contenteditable="true"] {
            background-color: #fff;
            border: 1px solid transparent;
            padding: 4px;
        }
        [contenteditable="true"]:hover {
            border-color: #007bff;
            cursor: pointer;
        }
        [contenteditable="true"]:focus {
            outline: none;
            border-color: #007bff;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div class="loading-content">
            <div class="spinner-border text-light" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Loading...</span>
            </div>
            <h3 class="text-light mt-3">磨刀霍霍向猪🐏</h3>
            <p class="text-light" id="processing-status">Please wait while we process your files...</p>
        </div>
    </div>

    <!-- Navigation -->
    {% include 'navbar.html' %}


    <!-- Main Content -->
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h2>后宫翻牌机</h2>
                <div class="card mt-3">
                    <div class="card-body">
                        <div id="drop-zone" class="border border-dashed p-5 text-center bg-light">
                            <i class="fas fa-cloud-upload-alt fa-3x mb-3"></i>
                            <h4>娘娘们一次性拉进来~~~~</h4>
                            <p>or</p>
                            <input type="file" id="file-input" multiple accept=".pdf" class="d-none">
                            <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">
                                小窗通融一下
                            </button>
                        </div>

                        <div id="file-list" class="mt-3">
                            <h5>被翻牌的娘娘有:</h5>
                            <ul class="list-group" id="selected-files">
                            </ul>
                        </div>

                        <div class="text-center mt-3">
                            <button id="process-btn" class="btn btn-success btn-lg" style="display: none;">
                                <i class="fas fa-cogs"></i> 烧水，开始洗澡
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Results Section -->
                <div id="results-section" class="mt-4" style="display: none;">
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            <h4 class="mb-0">下面是准备好名单，请过目👀</h4>
                        </div>
                        <div class="card-body">
                            <!-- Download Buttons -->
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <a id="excel-download" class="btn btn-success btn-block w-100">
                                        <i class="fas fa-file-excel"></i> 小主价目表 (Excel)
                                    </a>
                                </div>
                                <div class="col-md-6">
                                    <a id="pdf-download" class="btn btn-danger btn-block w-100">
                                        <i class="fas fa-file-pdf"></i> 小主合体名单 (PDF)
                                    </a>
                                </div>
                            </div>

                            <!-- ShipStation Data Table -->
                            <div class="table-responsive">
                                <h5>地址可以改的哈</h5>
                                <table class="table table-bordered table-striped" id="shipstation-table">
                                    <thead class="thead-dark">
                                        <tr>
                                            <th>#</th>
                                            <th>PO Number</th>
                                            <th>Company Name</th>
                                            <th>Address</th>
                                            <th>City</th>
                                            <th>State</th>
                                            <th>ZIP</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                    </tbody>
                                </table>
                            </div>

                            <!-- ShipStation Submit Button -->
                            <div class="text-center mt-4">
                                <button id="send-to-shipstation" class="btn btn-primary btn-lg">
                                    <i class="fas fa-shipping-fast"></i> 前往养心殿，等待小主们临幸 ( ShipStation )
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Main JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('file-input');
            const fileList = document.getElementById('selected-files');
            const processBtn = document.getElementById('process-btn');
            let uploadedFiles = [];

            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, preventDefaults, false);
                document.body.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, highlight, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, unhighlight, false);
            });

            function highlight(e) {
                dropZone.classList.add('border-primary');
            }

            function unhighlight(e) {
                dropZone.classList.remove('border-primary');
            }

            dropZone.addEventListener('drop', handleDrop, false);
            fileInput.addEventListener('change', handleFileSelect, false);

            function handleDrop(e) {
                const dt = e.dataTransfer;
                const files = dt.files;
                handleFiles(files);
            }

            function handleFileSelect(e) {
                const files = e.target.files;
                handleFiles(files);
            }

            function handleFiles(files) {
                uploadedFiles = [...files];
                updateFileList();
                processBtn.style.display = 'block';
            }

            function updateFileList() {
                fileList.innerHTML = '';
                const totalFiles = uploadedFiles.length;
                
                // Show first 3 files
                uploadedFiles.slice(0, 3).forEach((file, index) => {
                    const li = document.createElement('li');
                    li.className = 'list-group-item d-flex justify-content-between align-items-center';
                    li.innerHTML = `
                        <span><i class="fas fa-file-pdf text-danger"></i> ${file.name}</span>
                        <button class="btn btn-sm btn-danger" onclick="removeFile(${index})">
                            <i class="fas fa-times"></i>
                        </button>
                    `;
                    fileList.appendChild(li);
                });

                // Add total count if more than 3 files
                if (totalFiles > 3) {
                    const countLi = document.createElement('li');
                    countLi.className = 'list-group-item text-center font-weight-bold';
                    countLi.innerHTML = `<span class="badge bg-primary">共计名单有: ${totalFiles}</span>`;
                    fileList.appendChild(countLi);
                }
            }

            window.removeFile = function(index) {
                uploadedFiles.splice(index, 1);
                updateFileList();
                if (uploadedFiles.length === 0) {
                    processBtn.style.display = 'none';
                }
            }

            processBtn.addEventListener('click', async () => {
                const formData = new FormData();
                uploadedFiles.forEach(file => {
                    formData.append('files[]', file);
                });

                // Show loading overlay
                document.getElementById('loading-overlay').style.display = 'flex';
                document.getElementById('processing-status').textContent = 
                    `Processing ${uploadedFiles.length} files...`;

                try {
                    const response = await fetch('/lori_automation', {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();
                    displayResults(data);
                } catch (error) {
                    console.error('Error:', error);
                    alert('An error occurred while processing the files.');
                } finally {
                    // Hide loading overlay
                    document.getElementById('loading-overlay').style.display = 'none';
                }
            });

            function displayResults(data) {
                document.getElementById('results-section').style.display = 'block';
                
                // Set download links
                document.getElementById('excel-download').href = 'data:application/zip;base64,' + btoa(data.excel_zip);
                document.getElementById('excel-download').download = 'excel_files.zip';
                
                document.getElementById('pdf-download').href = 'data:application/pdf;base64,' + btoa(data.combined_pdf);
                document.getElementById('pdf-download').download = 'combined_orders.pdf';

                // Store original data
                window.shipstationData = JSON.parse(JSON.stringify(data.shipstation_data));

                // Populate editable table
                const tbody = document.getElementById('shipstation-table').querySelector('tbody');
                tbody.innerHTML = data.shipstation_data.map((order, index) => `
                    <tr data-row="${index}">
                        <td>${index + 1}</td>
                        <td contenteditable="true" data-field="orderNumber">${order.orderNumber}</td>
                        <td contenteditable="true" data-field="company">${order.shipTo.company}</td>
                        <td contenteditable="true" data-field="street1">${order.shipTo.street1}</td>
                        <td contenteditable="true" data-field="city">${order.shipTo.city}</td>
                        <td contenteditable="true" data-field="state">${order.shipTo.state}</td>
                        <td contenteditable="true" data-field="postalCode">${order.shipTo.postalCode}</td>
                    </tr>
                `).join('');

                // Add event listeners for editable cells
                tbody.addEventListener('input', (e) => {
                    const cell = e.target;
                    const row = cell.parentElement;
                    const rowIndex = row.dataset.row;
                    const field = cell.dataset.field;
                    const value = cell.textContent;

                    // Update the stored data
                    if (field === 'orderNumber') {
                        window.shipstationData[rowIndex].orderNumber = value;
                    } else {
                        window.shipstationData[rowIndex].shipTo[field] = value;
                    }
                });

                // Update send to ShipStation handler
                // Add this to the displayResults function
document.getElementById('send-to-shipstation').onclick = async () => {
    // Get button reference first
    const submitButton = document.getElementById('send-to-shipstation');
    
    try {
        // Show loading state
        submitButton.disabled = true;
        submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

        const response = await fetch('/send_to_shipstation', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                shipstation_data: window.shipstationData
            })
        });

        const result = await response.json();
        alert(`Successfully sent ${window.shipstationData.length} orders to ShipStation!`);

    } catch (error) {
        alert('Please verify your ShipStation connection and try again.');
    } finally {
        // Reset button state
        submitButton.disabled = false;
        submitButton.innerHTML = '<i class="fas fa-shipping-fast"></i> Send to ShipStation';
    }
};
            }
        });
    </script>
</body>
</html>
