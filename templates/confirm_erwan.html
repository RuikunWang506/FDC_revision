<!DOCTYPE html>
<html>
<head>
    <title>Confirm Erwan Input</title>
    <style>
        /* Basic styling for the popup */
        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }
        .popup table {
            width: 100%;
            border-collapse: collapse;
        }
        .popup th, .popup td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="popup">
        <h2>Confirm Items</h2>
        <table>
            <thead>
                <tr>
                    <th>SKU</th>
                    <th>Quantity</th>
                </tr>
            </thead>
            <tbody>
                {% for item in popup_data %}
                    <tr>
                        <td>{{ item[0] }}</td>
                        <td>{{ item[1] }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
        <form method="POST">
            <button type="submit" name="confirm">Confirm</button>
            <button type="submit" name="cancel">Cancel</button>
        </form>
    </div>
</body>
</html>
