<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Viewer</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log-entry { margin-bottom: 10px; }
        .info { color: green; }
        .error { color: red; }
        .timestamp { font-weight: bold; }
        .pagination {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.9); /* Slight background to improve readability */
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .pagination a {
            margin: 0 5px;
            text-decoration: none;
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .pagination a:hover {
            background-color: #0056b3;
        }
        .pagination a.disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>Log Viewer</h1>
    <div>
        {% for line in log_lines %}
            <div class="log-entry {{ line[0] }}">
                <span class="timestamp">{{ line[1] }}</span> - {{ line[2] }}
            </div>
        {% endfor %}
    </div>

    <!-- Pagination Controls -->
    <div class="pagination">
        {% if page > 1 %}
            <a href="{{ url_for('display', page=1) }}">First</a>
            <a href="{{ url_for('display', page=page-1) }}">Previous</a>
        {% else %}
            <a class="disabled">First</a>
            <a class="disabled">Previous</a>
        {% endif %}

        <span>Page {{ page }} of {{ total_pages }}</span>

        {% if page < total_pages %}
            <a href="{{ url_for('display', page=page+1) }}">Next</a>
            <a href="{{ url_for('display', page=total_pages) }}">Last</a>
        {% else %}
            <a class="disabled">Next</a>
            <a class="disabled">Last</a>
        {% endif %}
    </div>
</body>
</html>
