<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Label Audit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .table-responsive {
            overflow-x: auto;
        }
        .table th, .table td {
            text-align: center;
        }
        .filter-section {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    {% include 'navbar.html' %}
    
    <div class="container mt-5">
        <h1 class="text-center mb-4">Label Audit System</h1>
        
        <!-- Filter Controls -->
        <div class="filter-section">
            <h3 class="mb-3">Data Filters</h3>
            <div class="row mb-4">
                <div class="col-md-3">
                    <label for="viewType" class="form-label">View Type</label>
                    <select id="viewType" class="form-select">
                        <option value="all" {% if current_view_type == 'all' %}selected{% endif %}>All Data</option>
                        <option value="week" {% if current_view_type == 'week' %}selected{% endif %}>Weekly</option>
                        <option value="month" {% if current_view_type == 'month' %}selected{% endif %}>Monthly</option>
                    </select>
                </div>
                
                <div class="col-md-2">
                    <label for="yearSelect" class="form-label">Year</label>
                    <select id="yearSelect" class="form-select">
                        {% for year in available_years %}
                        <option value="{{ year }}" {% if year == current_year %}selected{% endif %}>{{ year }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="col-md-2" id="monthSelectContainer" {% if current_view_type != 'month' %}style="display:none"{% endif %}>
                    <label for="monthSelect" class="form-label">Month</label>
                    <select id="monthSelect" class="form-select">
                        {% for year, month in available_months %}
                        <option value="{{ month }}" data-year="{{ year }}" 
                            {% if year == current_year and month == current_month %}selected{% endif %}>
                            {{ month }}/{{ year }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="col-md-2" id="weekSelectContainer" {% if current_view_type != 'week' %}style="display:none"{% endif %}>
                    <label for="weekSelect" class="form-label">Week</label>
                    <select id="weekSelect" class="form-select">
                        {% for year, week in available_weeks %}
                        <option value="{{ week }}" data-year="{{ year }}" 
                            {% if year == current_year and week == current_week %}selected{% endif %}>
                            Week {{ week }} - {{ week|week_to_month(year) }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="col-md-3">
                    <label for="platformSelect" class="form-label">Platform</label>
                    <select id="platformSelect" class="form-select">
                        <option value="">All Platforms</option>
                        {% for platform in available_platforms %}
                        <option value="{{ platform }}" {% if platform == current_platform %}selected{% endif %}>{{ platform }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-12">
                    <button id="applyFiltersBtn" class="btn btn-primary me-2">Apply Filters</button>
                    <a id="exportDataBtn" href="/dailytodo/export" class="btn btn-success" target="_blank">Export to Excel</a>
                </div>
            </div>
        </div>
        
        <!-- Platform Totals Table -->
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Platform Totals</h3>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            {{ platform_totals|safe }}
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Historical Data Table -->
        <div class="row mb-5">
            <div class="col-md-12">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Daily Breakdown</h3>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            {{ historical_table|safe }}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Handle view type changes
            document.getElementById('viewType').addEventListener('change', function() {
                const viewType = this.value;
                const monthContainer = document.getElementById('monthSelectContainer');
                const weekContainer = document.getElementById('weekSelectContainer');
                
                if (viewType === 'month') {
                    monthContainer.style.display = 'block';
                    weekContainer.style.display = 'none';
                } else if (viewType === 'week') {
                    monthContainer.style.display = 'none';
                    weekContainer.style.display = 'block';
                } else {
                    monthContainer.style.display = 'none';
                    weekContainer.style.display = 'none';
                }
            });
            
            // Apply filters button
            document.getElementById('applyFiltersBtn').addEventListener('click', function() {
                const viewType = document.getElementById('viewType').value;
                const year = document.getElementById('yearSelect').value;
                const platform = document.getElementById('platformSelect').value;
                
                let url = `/online_audit?view_type=${viewType}&year=${year}`;
                
                if (viewType === 'month') {
                    const month = document.getElementById('monthSelect').value;
                    url += `&month=${month}`;
                } else if (viewType === 'week') {
                    const week = document.getElementById('weekSelect').value;
                    url += `&week=${week}`;
                }
                
                if (platform) {
                    url += `&platform=${platform}`;
                }
                
                window.location.href = url;
            });
            
            // Update export link when filters change
            function updateExportLink() {
                const viewType = document.getElementById('viewType').value;
                const year = document.getElementById('yearSelect').value;
                const platform = document.getElementById('platformSelect').value;
                
                let url = `/dailytodo/export?view_type=${viewType}&year=${year}`;
                
                if (viewType === 'month') {
                    const month = document.getElementById('monthSelect').value;
                    url += `&month=${month}`;
                } else if (viewType === 'week') {
                    const week = document.getElementById('weekSelect').value;
                    url += `&week=${week}`;
                }
                
                if (platform) {
                    url += `&platform=${platform}`;
                }
                
                document.getElementById('exportDataBtn').href = url;
            }
            
            // Add change listeners to update export link
            document.getElementById('viewType').addEventListener('change', updateExportLink);
            document.getElementById('yearSelect').addEventListener('change', updateExportLink);
            document.getElementById('monthSelect').addEventListener('change', updateExportLink);
            document.getElementById('weekSelect').addEventListener('change', updateExportLink);
            document.getElementById('platformSelect').addEventListener('change', updateExportLink);
            
            // Initialize the export link
            updateExportLink();
        });
    </script>
</body>
</html>
