<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Tools</title>
    <!-- Updated Bootstrap to the latest version (optional but recommended) -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="https://www.4seller.com/favicon.ico">
    <style>
        /* Set all icons within list-group-item to 100x100 pixels */
        .list-group-item img {
            width: 100px;
            height: 100px;
            margin-right: 20px;
        }

        /* Increase the font size for the link text */
        .list-group-item .link-text {
            font-size: 1.5rem; /* Adjust as needed */
            font-weight: bold;
        }

        /* Ensure the list-group-item uses flexbox for proper alignment */
        .list-group-item {
            display: flex;
            align-items: center;
            padding: 20px; /* Increased padding for larger cells */
        }

        /* Optional: Add hover effect for better user experience */
        .list-group-item:hover {
            background-color: #f8f9fa;
            transition: background-color 0.3s ease;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .list-group-item {
                flex-direction: column;
                text-align: center;
            }

            .list-group-item img {
                margin-right: 0;
                margin-bottom: 10px;
            }

            .list-group-item .link-text {
                font-size: 1.25rem;
            }
        }
    </style>
    <script>
        function openAllLinks() {
            // Select all <a> elements within .list-group
            const linkElements = document.querySelectorAll('.list-group a');
            let popups = [];
            let totalLinks = 0;

            linkElements.forEach(link => {
                const href = link.getAttribute('href');
                // Only open links that start with http or https
                if (href.startsWith('http://') || href.startsWith('https://')) {
                    totalLinks++;
                    let newWindow = window.open(href, '_blank');
                    if (newWindow) {
                        popups.push(newWindow);
                    }
                }
            });

            if (popups.length !== totalLinks) {
                alert('Some popups were blocked. Please allow popups for this site.');
            }
        }

        function checkSuperBrowser() {
            setTimeout(() => {
                alert('SuperBrowser is not installed. Please install it to use this feature.');
            }, 500);
        }
    </script>
</head>
<body>
    <!-- Include Navbar -->
    {% include 'navbar.html' %}

    <div class="container my-5">
        <h2 class="mb-4">Quick Access Links</h2>
        <!-- Button to Open All Links -->
        <button class="btn btn-primary btn-block mb-4" onclick="openAllLinks()" aria-label="Open all seller dashboard links">
            Open All Links
        </button>

        <!-- Individual Links -->
        <div class="list-group">
            <a href="https://www.4seller.com/web/dashboard.html" target="_blank" class="list-group-item list-group-item-action">
                <img src="https://4seller-res.meiyunji.net/europe-erp-web/2024-12/favicon.ico?v=1.1" alt="4Seller Logo">
                <span class="link-text">4Seller Dashboard</span>
            </a>
            <a href="https://seller-us.tiktok.com/order" target="_blank" class="list-group-item list-group-item-action">
                <img src="https://www.tiktok.com/favicon.ico" alt="TikTok Logo">
                <span class="link-text">TikTok Orders</span>
            </a>
            <a href="https://seller.temu.com/orders.html" target="_blank" class="list-group-item list-group-item-action">
                <img src="https://www.temu.com/favicon.ico" alt="Temu Logo">
                <span class="link-text">Temu Orders</span>
            </a>
            <a href="https://sellerhub.shein.com/#/gsp/order-management/list" target="_blank" class="list-group-item list-group-item-action">
                <img src="https://www.shein.com/favicon.ico" alt="Shein Logo">
                <span class="link-text">Shein Orders</span>
            </a>
            <a href="https://ship13.shipstation.com" target="_blank" class="list-group-item list-group-item-action">
                <img src="https://www.shipstation.com/wp-content/uploads/2024/08/cropped-favicon-32x32.png" alt="ShipStation Logo">
                <span class="link-text">ShipStation</span>
            </a>
            <a href="https://admin.genuinepartsgiant.com/HPD/pendingOrders/orderTypeId/-1" target="_blank" class="list-group-item list-group-item-action">
                <img src="https://img.icons8.com/?size=100&id=12684&format=png&color=000000" alt="GPG">
                <span class="link-text">GPG</span>
            </a>
        </div>
    </div>

    {% include 'footer.html' %}
    <!-- Optional: Update Bootstrap JS to the latest version -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
