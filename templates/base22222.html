<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Your Website Title{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% block navbar %}
    <!-- Include Navbar here if you have one -->
    {% include 'navbar.html' %}
    {% endblock %}

    {% block content %}
    <!-- This block will be overridden by child templates -->
    {% endblock %}

    <svg width="100" height="100">
        <!-- Placeholder for your Handbag SVG content -->
        <rect width="100" height="100" style="fill:blue;"/>
    </svg>

    {% block footer %}
    <!-- Include Footer here if you have one -->
    {% include 'footer.html' %}
    {% endblock %}
</body>
</html>
