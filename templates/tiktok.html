<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok 工具</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef6ff 0%, #f9fbff 100%);
            min-height: 100vh;
            color: #1f2937;
        }

        .page-wrap {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 16px 32px;
        }

        .hero {
            background: white;
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            margin-bottom: 18px;
            border: 1px solid #e2e8f0;
        }

        .hero h1 {
            margin: 0 0 8px;
            font-size: 30px;
            color: #0f172a;
        }

        .hero p {
            margin: 0;
            color: #475569;
            font-size: 15px;
        }

        .shortcut-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
        }

        .shortcut-card {
            display: block;
            text-decoration: none;
            background: white;
            border: 1px solid #dbe5f2;
            border-radius: 12px;
            padding: 18px;
            color: #0f172a;
            box-shadow: 0 5px 18px rgba(15, 23, 42, 0.05);
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }

        .shortcut-card:hover {
            transform: translateY(-2px);
            border-color: #93c5fd;
            box-shadow: 0 10px 24px rgba(37, 99, 235, 0.14);
        }

        .shortcut-card .icon {
            width: 36px;
            height: 36px;
            border-radius: 9px;
            display: grid;
            place-items: center;
            background: #eff6ff;
            color: #2563eb;
            margin-bottom: 10px;
        }

        .shortcut-card h3 {
            margin: 0 0 6px;
            font-size: 17px;
        }

        .shortcut-card p {
            margin: 0;
            color: #475569;
            font-size: 13px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <div class="hero">
            <h1>TikTok 快捷入口</h1>
            <p>TikTok 工作流工具快速访问页面。</p>
        </div>

        <div class="shortcut-grid">
            <a class="shortcut-card" href="/master_image_viewer">
                <div class="icon"><i class="fas fa-images"></i></div>
                <h3>主图查看器</h3>
                <p>打开图片查看页面，按 SKU 查询图片。</p>
            </a>

            <a class="shortcut-card" href="/tiktok/tk_product_detail">
                <div class="icon"><i class="fas fa-box-open"></i></div>
                <h3>商品查询</h3>
                <p>打开 TikTok 商品详情页面，不显示成本、客户和单价列。</p>
            </a>

            <a class="shortcut-card" href="/external_stock_check">
                <div class="icon"><i class="fas fa-warehouse"></i></div>
                <h3>外部库存检查</h3>
                <p>打开外部库存检查页面，现有密码弹窗逻辑保持不变。</p>
            </a>
        </div>
    </div>

    {% if not current_user and not session.tk_user %}
    <div id="tkPasswordModal" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.85);z-index:99999;display:flex;align-items:center;justify-content:center;">
        <form method="POST" action="/tiktok/tk_password" style="background:#222;padding:2rem 2.5rem;border-radius:18px;box-shadow:0 8px 32px rgba(0,212,255,0.18);display:flex;flex-direction:column;align-items:center;min-width:320px;">
            <input type="hidden" name="next" value="{{ request.path }}">
            <h2 style="color:#00d4ff;margin-bottom:1.5rem;">请输入 TK 密码</h2>
            <input type="password" name="password" placeholder="请输入密码" style="padding:0.8rem 1.2rem;border-radius:10px;border:1px solid #00d4ff;font-size:1.1rem;margin-bottom:1.2rem;width:100%;" autofocus required>
            <button type="submit" style="padding:0.8rem 2rem;background:linear-gradient(135deg,#00d4ff,#1cc88a);border:none;border-radius:10px;color:white;font-weight:600;font-size:1.1rem;cursor:pointer;">提交</button>
        </form>
    </div>
    {% endif %}
</body>
</html>
