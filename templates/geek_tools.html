<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>advanced_tools</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="icon" type="image/svg+xml" href="/static/icons/handbag.svg">
    <style>
        .custom-btn {
            padding: 40px 40px !important;
            font-size: 40px !important;
            border-radius: 50px !important; /* Changed from 100px to 50px to create oval shapes */
            margin: 20px !important;
            width: 250px !important; /* Adjust width to desired oval shape */
            height: 300px !important; /* Adjust height to desired oval shape */
            transition: background-color 0.3s, transform 0.3s !important;
            align-items: center !important;
            justify-content: center !important;
            flex-direction: column !important;
            line-height: 1 !important; /* Adjusted line-height to reduce space between lines */
        }
        .custom-btn:hover {
            transform: translateY(-30px) !important;
        }
        .custom-btn img {
            margin-right: 10px !important;
            width: 80px !important;
            height: 80px !important;
        }
        .custom-btn h4 {
            margin-top: 5px !important; /* Reduced margin to reduce space between lines */
            margin-bottom: 0 !important; /* Reduced bottom margin */
        }
        /* Media query for cellphones */
        @media (max-width: 768px) {
            .custom-btn {
                padding: 20px 20px !important;
                font-size: 20px !important;
                border-radius: 25px !important;
                margin: 10px !important;
                width: 125px !important;
                height: 150px !important;
            }
            .custom-btn img {
                width: 40px !important;
                height: 40px !important;
            }
            .custom-btn h4 {
                font-size: 18px !important;
            }
        }
    </style>
</head>
<body>
    <!-- Include Navbar -->
    {% include 'navbar.html' %}
    <!-- End of Navbar -->

    <div class="container mt-5 text-center">
        <h1>Advanced toolkit for Tristen</h1>
        <div class="mt-4">
            <a href="/geek_tools/custom_query" class="btn btn-primary custom-btn">
                SQL Custom Query
            </a>
            <a href="/calculator" class="btn btn-info custom-btn">
            <img src="/static/icons/calculator.ico" alt="calculator">
                calculator
            </a>

            <a class="btn btn-info custom-btn" href="/temu">
                <img src="https://seller.temu.com/favicon.ico" alt="temu">Temu
            </a>
            <a class="btn btn-info custom-btn" href="/upload_center">
                <img src="https://img.icons8.com/clouds/200/upload.png" alt="图片处理">图片处理
            </a>   

            
            
        </div>
        taskkill /F /IM pythonw.exe 

    </div>
    {% include 'footer.html' %}
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}" ></script>
</body>
</html>
